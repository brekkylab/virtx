[package]
name = "virtx-core"
version = "0.1.2"
edition = "2024"
publish = false

[lib]
# `rlib` for Rust (this crate's tests, and any crate that depends on it); `cdylib` and
# `staticlib` for C, as `libvirtx_core.{so,dylib,dll}` and `libvirtx_core.a`, declared by
# `include/virtx.h`.
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
# What the types need, and all they need: a crate that only names requests and their answers
# (`virtx-rs`, which reaches the library through the C ABI) takes `default-features = false`.
anyhow = "1"
# `serde` so a volume's file contents are a CBOR byte string, not an array of integers.
bytes = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

# HTTP for the Streamable HTTP client. The same reqwest 0.13 and rustls the `virtx` crate uses.
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
# The headers and statuses of Streamable HTTP, and a method's `Extensions`.
http = { version = "1", optional = true }
# The Streamable HTTP server: the bodies of the requests and responses it handles.
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
# `Stream`, which a call's progress is, and the macro that writes one.
futures-util = { version = "0.3", default-features = false, optional = true }
async-stream = { version = "0.3", optional = true }
# Every message, and what crosses the C ABI, is CBOR.
ciborium = { version = "0.2", optional = true }
# A session brings its own runtime, since C calls in without one. `rt-multi-thread` so the
# session's tasks run between C calls, not only inside one.
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"], optional = true }

[build-dependencies]
# Writes `include/virtx.h` from `src/ffi.rs`.
cbindgen = { version = "0.29", default-features = false }

[dev-dependencies]
# The types' tests read their wire form back.
ciborium = "0.2"
# What serves the Streamable HTTP tests' server.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# The stdio tests' server reads its own stdin and writes its own stdout.
tokio = { version = "1", features = ["io-std"] }

[features]
# The types (`image`, `volume`, the methods' args and outputs) are always built. `client` adds
# the wire's client end, `server` its server end, and `ffi` the C ABI over a client, which is
# what `libvirtx_core` is built for. The tests of both ends together run with both on.
default = ["ffi"]
client = [
    "dep:reqwest",
    "dep:http",
    "dep:futures-util",
    "dep:async-stream",
    "dep:ciborium",
    "dep:tokio",
]
server = [
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:ciborium",
    "dep:tokio",
]
ffi = ["client"]
