# The one place the client's packages are built: the wheel (setuptools-rust), the platform's npm
# package (napi) and `@brekkylab/virtx`. On Linux it runs in the manylinux image, with its Python.
name: pack
description: Build this platform's wheel and npm package, and @brekkylab/virtx, into a directory.

inputs:
  platform:
    description: The platform's npm name (darwin-arm64, linux-x64-gnu, ...)
    required: true
  target:
    description: The Rust target triple the library is built for
    required: true
  out:
    description: The directory the wheel and the package's tarball go into
    required: true

runs:
  using: composite
  steps:
    # npm 11: npm 10 runs `prepare` despite --ignore-scripts.
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: 24

    - if: runner.os != 'Linux'
      uses: actions/setup-python@v7.1.0
      with:
        python-version: "3.12"

    - name: Wheel
      shell: bash
      env:
        CARGO_BUILD_TARGET: ${{ inputs.target }}
        OUT: ${{ inputs.out }}
      run: |
        mkdir -p "$OUT"
        python -m pip install --quiet build~=1.6 wheel~=0.48
        # setuptools takes the LICENSE beside pyproject.toml.
        cp LICENSE virtx-py/
        python -m build --wheel --outdir "$OUT" virtx-py
        # The library is no CPython extension, so any Python 3 opens it. The platform is named,
        # not the building Python's: setup-python's macOS one is universal2. On Linux, not
        # auditwheel: `pipeline` checks the library links glibc alone.
        case "$RUNNER_OS" in
          Linux) plat=(--platform-tag "manylinux_2_28_$(uname -m)") ;;
          macOS) plat=(--platform-tag "macosx_11_0_$(uname -m)") ;;
          *) plat=() ;;
        esac
        python -m wheel tags --remove --python-tag py3 --abi-tag none "${plat[@]}" "$OUT"/virtx-*.whl

    - name: npm package
      shell: bash
      working-directory: virtx-node
      env:
        PLATFORM: ${{ inputs.platform }}
        TARGET: ${{ inputs.target }}
        OUT: ${{ inputs.out }}
      run: |
        npm ci --ignore-scripts --no-audit --no-fund
        npx napi create-npm-dirs
        npx napi build --platform --release --no-js --target "$TARGET" \
          --manifest-path ../virtx-cabi/Cargo.toml --output-dir "npm/$PLATFORM"
        cp ../LICENSE "npm/$PLATFORM/"
        npm pack "./npm/$PLATFORM" --pack-destination "$GITHUB_WORKSPACE/$OUT"

    # npm packs only what is in `virtx-node/`. The platform packages are named here, not in
    # package.json: its lock could not name a version not yet published. What builds the
    # package from a clone is left out.
    - name: "@brekkylab/virtx"
      shell: bash
      working-directory: virtx-node
      env:
        OUT: ${{ inputs.out }}
      run: |
        cp ../README.md ../LICENSE .
        version=$(node -p 'require("./package.json").version')
        for dir in npm/*/; do
          npm pkg set "optionalDependencies.$(node -p "require('./${dir}package.json').name")=$version"
        done
        npm pkg delete scripts devDependencies napi
        npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/$OUT"
