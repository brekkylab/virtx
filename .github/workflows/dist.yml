# Build the stdio server, `virtx-stdio`, for every platform it is published for, and attach
# the archives to the GitHub release of the tag this runs on, one per platform:
#
#   virtx-stdio-<os>-<arch>.tar.gz      with SHA256SUMS over all of them
#
# The release is created as a draft if the tag has none, and the archives are attached
# only once every platform has built, so a release never holds some platforms and not
# others. Publishing it is a person's step, after this has finished: `packages` runs on the
# published release, and what a client of that version fetches is what hangs here.
#
# A push to a branch runs nothing: a build is either a release, or asked for. A dispatch
# on a tag attaches to that tag's release the same way, so a release can be rebuilt without
# retagging; a dispatch on anything else keeps the archives as a workflow artifact, to try.
#
# The server and the client packages are one commit, and so speak one protocol: a tag runs
# this and, once its release is published, `packages`.
#
# # Platforms
#
# | release        | runner           | kernel and abin from                   | host build |
# |----------------|------------------|----------------------------------------|------------|
# | macos-aarch64  | macos-15         | kernel.c, abin: the arm64 Linux job    | gpu        |
# | linux-x86_64   | ubuntu-24.04, in manylinux_2_28     | libkrunfw.so, abin: x86_64 Linux job | gpu |
# | linux-aarch64  | ubuntu-24.04-arm, in manylinux_2_28 | libkrunfw.so, abin: arm64 Linux job  | gpu |
# | windows-x86_64 | windows-2025     | libkrunfw.dll, abin: x86_64 Linux job  | gpu        |
#
# The guest kernel is built in a Linux container (see xtask/scripts/build-libkrunfw.sh),
# which neither GitHub's macOS runners (no Docker) nor its Windows runners (Windows
# containers) can run -- so the two Linux jobs build every platform's kernel and hand it on.
# abin and alib go the same way: they are the guest's, so they depend on the architecture and
# not on the host, and abin's C (SQLite) is cross-compiled by `xtask/scripts/musl-cc.sh`, a
# shell script around clang that Windows cannot run. One build per architecture, then.
#
# # The glibc floor
#
# A Linux release runs on glibc 2.28 and later -- RHEL 8, Debian 10, Ubuntu 20.04 on. Its two
# executables are built in a manylinux_2_28 container (AlmaLinux 8), because a binary needs
# the glibc of the headers it was compiled against: built on the runner itself, glibc 2.39,
# it would need 2.39. What they link is that glibc and nothing else a distribution ships at
# its own version -- no OpenSSL (oci-client is rustls on Linux), no libdrm, and Vulkan only
# opened at run time. `The glibc floor` checks both, after every build.
name: dist

on:
  push:
    tags: ["*"]
  workflow_dispatch:

concurrency:
  group: dist
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  guest-parts:
    name: guest parts (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            targets: linux windows
          - arch: aarch64
            runner: ubuntu-24.04-arm
            targets: linux macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # A kernel is only its tag, its config and this script; the Makefile and configs come
      # from the libkrunfw clone, pinned by tag in the script.
      - uses: actions/cache@v6
        id: cache
        with:
          path: build/krunfw
          key: kernel-${{ matrix.arch }}-${{ matrix.targets }}-${{ hashFiles('xtask/scripts/build-libkrunfw.sh') }}

      - name: Kernel
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          for target in ${{ matrix.targets }}; do
            echo "::group::libkrunfw for $target"
            LIBKRUNFW_TARGET=$target sh xtask/scripts/build-libkrunfw.sh
            echo "::endgroup::"
          done

      - run: ls -la build/krunfw

      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.arch }}-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: abin-${{ matrix.arch }}

      - name: abin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm
          cargo xtask build abin alib
          ls -la target/release/abin target/release/alib

      # alib as `build/alib/`, where `build alib` puts it and `build server-stdio` and `archive`
      # take it from, as they take the kernel from `build/krunfw/`.
      - name: Hand the kernel, abin and alib on
        run: |
          mkdir -p "$GITHUB_WORKSPACE/handoff/kernel"
          cp -v build/krunfw/* "$GITHUB_WORKSPACE/handoff/kernel/"
          cp -R target/release/abin "$GITHUB_WORKSPACE/handoff/abin"
          cp -R build/alib "$GITHUB_WORKSPACE/handoff/alib"

      # Through the cache rather than as artifacts: this repository's artifacts count against
      # the organization's storage quota, and its cache does not. One entry per run, which
      # every `dist` job of the arch restores, whatever its OS.
      - uses: actions/cache/save@v6
        with:
          path: handoff
          key: handoff-${{ matrix.arch }}-${{ github.run_id }}
          enableCrossOsArchive: true

  dist:
    name: dist (${{ matrix.release }})
    needs: guest-parts
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: macos-aarch64
            runner: macos-15
            kernel: aarch64
            musl: aarch64-unknown-linux-musl
          - release: linux-x86_64
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            kernel: x86_64
            musl: x86_64-unknown-linux-musl
          - release: linux-aarch64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            kernel: aarch64
            musl: aarch64-unknown-linux-musl
          - release: windows-x86_64
            runner: windows-2025
            kernel: x86_64
            musl: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    # The Linux releases' glibc floor -- see above. None for macOS and Windows.
    container: ${{ matrix.container }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      # Before any checkout: Windows' git converts to CRLF by default, and the GPU libraries'
      # builds under 3rdparty/ run shell scripts written against LF.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          submodules: true

      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.musl }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Apart from anything built on the runner itself: C compiled against its newer
          # glibc's headers, restored here, would put that glibc back into the release.
          key: ${{ matrix.release }}${{ matrix.container && '-manylinux_2_28' || '' }}

      # In the manylinux_2_28 container, as root: AlmaLinux's packages, and the image's own
      # Python for meson and virglrenderer's generators. The image sets PKG_CONFIG_PATH, and
      # `.cargo/config.toml`'s [env] does not override a set variable, so virglrenderer's
      # goes in front of it here.
      - name: Toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          # zstd too: the handoff below is compressed with it, and a cache restores only where
          # it is decompressed the way it was compressed.
          dnf -y -q install clang clang-devel llvm lld vulkan-headers vulkan-loader-devel zstd
          py=/opt/python/cp312-cp312/bin
          "$py/pip" install -q --root-user-action=ignore meson ninja pyyaml mako
          echo "$py" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$PWD/build/virglrenderer/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install lld llvm meson ninja

      # virglrenderer's Windows build: pkg-config, and libclang for bindgen -- see the
      # README's Windows section. No Vulkan SDK: build-deps.ps1 makes do with the headers
      # virglrenderer bundles, and an import library it makes from them.
      - name: Toolchain (Windows)
        if: runner.os == 'Windows'
        run: |
          # pkg-config.exe itself: build-deps.ps1 asks PowerShell for it, and the one Git
          # Bash finds first is not an .exe PowerShell can run.
          choco install -y --no-progress pkgconfiglite
          where.exe pkg-config.exe
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      - name: Add the guest's musl target
        run: cargo xtask init

      # MoltenVK takes most of a macOS build, and changes only with its submodule.
      - name: MoltenVK cache
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: |
            3rdparty/MoltenVK/Package
          key: moltenvk-${{ hashFiles('.git/modules/MoltenVK/HEAD', 'xtask/scripts/build-deps.sh') }}

      - uses: actions/cache/restore@v6
        with:
          path: handoff
          key: handoff-${{ matrix.kernel }}-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Put the kernel in place
        run: |
          mkdir -p build/krunfw
          case "${{ matrix.release }}" in
            macos-*)   LIBKRUNFW_KERNEL_C="$GITHUB_WORKSPACE/handoff/kernel/kernel.c" cargo xtask build kernel ;;
            linux-*)   cp -v "$GITHUB_WORKSPACE"/handoff/kernel/libkrunfw.so.* build/krunfw/ ;;
            windows-*) cp -v "$GITHUB_WORKSPACE"/handoff/kernel/libkrunfw.dll build/krunfw/ ;;
          esac
          ls -la build/krunfw

      - name: Put abin and alib in place
        run: |
          mkdir -p target/release build
          cp -R "$GITHUB_WORKSPACE/handoff/abin" target/release/
          cp -R "$GITHUB_WORKSPACE/handoff/alib" build/
          ls -la target/release/abin build/alib

      - name: Build
        run: cargo xtask build server-stdio

      - name: virglrenderer's log (Windows, on failure)
        if: failure() && runner.os == 'Windows'
        run: |
          log=build/virglrenderer-build.log
          # Windows PowerShell writes a redirect as UTF-16.
          [ -f "$log" ] || { echo "no $log"; exit 0; }
          iconv -f UTF-16 -t UTF-8 "$log" > "$log.txt" 2>/dev/null || tr -d '\000' < "$log" > "$log.txt"
          grep -nE "^FAILED|error( [A-Z]+[0-9]+)?:" "$log.txt" | head -20
          echo ...
          grep -nE -B3 -A6 "error( [A-Z]+[0-9]+)?:" "$log.txt" | head -80
          tail -30 build/virglrenderer-build/meson-logs/meson-log.txt 2>/dev/null || true

      - name: What was built
        run: |
          ls -la target/release | grep -E "virtx-stdio|libkrunfw" || true
          ls target/release/abin target/release/alib || true

      # What a Linux release asks of the machine it runs on -- see "The glibc floor" above.
      # `__isoc23_*` is glibc 2.38's, and comes in unversioned, so the version check alone
      # would not see it.
      - name: The glibc floor (Linux)
        if: runner.os == 'Linux'
        run: |
          floor=28
          for exe in target/release/virtx-stdio; do
            need=$(objdump -T "$exe" | grep -oE 'GLIBC_2\.[0-9]+' | sort -t. -k2 -n -u | tail -1)
            libs=$(objdump -p "$exe" | awk '/NEEDED/{print $2}' | tr '\n' ' ')
            echo "$exe: needs $need; links $libs"
            [ "${need#GLIBC_2.}" -le "$floor" ] || { echo "::error::$exe needs $need, above glibc 2.$floor"; fail=1; }
            if objdump -T "$exe" | grep -q __isoc23_; then echo "::error::$exe references __isoc23_*, glibc 2.38's"; fail=1; fi
            if printf '%s' "$libs" | grep -qE 'libssl|libcrypto'; then echo "::error::$exe links OpenSSL"; fail=1; fi
          done
          exit ${fail:-0}

      # What each executable needs from the loader at start-up, delay-loaded or not -- the
      # DLLs a release has to carry are the ones in the first list that Windows itself
      # does not ship.
      - name: DLL imports (Windows)
        if: runner.os == 'Windows'
        run: |
          readobj="/c/Program Files/LLVM/bin/llvm-readobj.exe"
          for exe in target/release/virtx-stdio.exe; do
            echo "== $exe"
            "$readobj" --coff-imports "$exe" | awk '/^Import \{/{k="load"} /^DelayImport \{/{k="delay"} /Name: .*\.dll/{print "  " k ": " $2}' | sort -u | tee "$RUNNER_TEMP/imports.txt"
            # Nothing a release does not carry and Windows may not have, loaded at start-up:
            # the C++ runtime is linked in, and the rest are delay-loaded, so a host without
            # them still runs virtx-stdio far enough to say what to install.
            if grep -iE "load: (vcruntime|msvcp|vulkan-1|winhv)" "$RUNNER_TEMP/imports.txt"; then
              echo "::error::$exe needs the DLLs above to start"; fail=1
            fi
          done
          exit ${fail:-0}

      - name: Archive
        run: cargo xtask archive --with-abin

      # Through the cache, as the handoff above: one entry per platform and run, which
      # `release` restores.
      - uses: actions/cache/save@v6
        with:
          path: target/release/dist/virtx-stdio-${{ matrix.release }}.tar.gz
          key: dist-${{ matrix.release }}-${{ github.run_id }}
          enableCrossOsArchive: true

  # Every platform's archive, together: `needs` makes this wait for all four and skips it
  # if any failed, so nothing is attached until the whole set is there.
  release:
    needs: dist
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/cache/restore@v6
        with:
          path: target/release/dist/virtx-stdio-macos-aarch64.tar.gz
          key: dist-macos-aarch64-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v6
        with:
          path: target/release/dist/virtx-stdio-linux-x86_64.tar.gz
          key: dist-linux-x86_64-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v6
        with:
          path: target/release/dist/virtx-stdio-linux-aarch64.tar.gz
          key: dist-linux-aarch64-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v6
        with:
          path: target/release/dist/virtx-stdio-windows-x86_64.tar.gz
          key: dist-windows-x86_64-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: SHA256SUMS
        working-directory: target/release/dist
        run: |
          sha256sum virtx-stdio-*.tar.gz | tee SHA256SUMS
          ls -la

      # The tag's release, a draft if it has none yet. `--clobber`: a rebuilt release
      # replaces what an earlier run attached.
      - name: Attach to the release
        if: github.ref_type == 'tag'
        working-directory: target/release/dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '"release exists, draft: " + (.isDraft | tostring)' \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --generate-notes
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber virtx-stdio-*.tar.gz SHA256SUMS
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name)\t\(.size) bytes"'

      - name: Keep as an artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: virtx-stdio-${{ github.sha }}
          path: |
            target/release/dist/virtx-stdio-*.tar.gz
            target/release/dist/SHA256SUMS
          retention-days: 3
