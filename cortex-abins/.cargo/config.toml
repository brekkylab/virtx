# Cross-linking a Linux/musl static binary from a macOS host: the system `cc` targets Mach-O
# and cannot produce an ELF, so link with the `rust-lld` that ships with the toolchain instead
# of looking for a musl-gcc that is not there.
#
# `-C linker=rust-lld` and not `-C linker-flavor=ld.lld`: the second one names a flavour and
# leaves rustc looking for an `lld` on `PATH`, which is a linker nobody installed. This names
# the one in the toolchain's own sysroot, which is there for anyone who ran
# `rustup target add`.
[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "linker=rust-lld"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "linker=rust-lld"]

# Unlike `cortex-krun-guest`, that is not the whole story here: `rusqlite`'s `bundled` feature
# compiles SQLite's amalgamation, so this build has C in it, and `cc-rs` left alone reaches
# for `aarch64-linux-musl-gcc` -- a cross-gcc nobody has -- and then for the host's `cc`,
# which targets Mach-O. Both wrappers are in `scripts/` and both are thin: clang is already a
# cross-compiler and `llvm-ar` already writes ELF archives, so what they add is a target
# triple, a sysroot (`scripts/fetch-musl-sysroot.sh`) and, for the archiver, knowing where
# Homebrew hides a keg-only LLVM. See each script for why it exists.
#
# Not `force`d: a machine with a real musl cross-toolchain sets `CC_<triple>` in its own
# environment and wins, which is what this would want on a Linux CI host.
[env]
CC_aarch64_unknown_linux_musl = { value = "../scripts/musl-cc.sh", relative = true }
AR_aarch64_unknown_linux_musl = { value = "../scripts/musl-ar.sh", relative = true }
CC_x86_64_unknown_linux_musl = { value = "../scripts/musl-cc.sh", relative = true }
AR_x86_64_unknown_linux_musl = { value = "../scripts/musl-ar.sh", relative = true }
