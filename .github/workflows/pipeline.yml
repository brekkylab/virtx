# Everything a ref is built into, and tested, platform by platform; `ci` and `release` call it.
#
# Two depths. Every run lints each platform and runs the tests that boot machines. A `full` one
# -- `main`'s, a release's, and one started by hand -- also builds what a release
# carries, for every platform, packs each platform's packages and tries them: what a pull
# request rarely changes, and finds out about on `main` if it does. Each job waits for what it
# uses and nothing else, so a platform answers as soon as it is done, whatever another
# platform's runner is still queued behind:
#
#   job (as the checks name it)           waits for     does
#   version                               nothing       every manifest says one version
#   check                                 nothing       format, clippy, unit tests, the bindings' lint
#   guest (x86_64, aarch64)               version       the guest kernel, abin and alib
#   lint (windows-x86_64,                 nothing       clippy with `gpu`, on this platform
#     linux-x86_64, linux-aarch64)
#   tests (linux-x86_64)                  nothing       the crates' and packages' suites, on KVM
#   tests (windows-x86_64)                nothing       the machine-booting suites, on WHP
#
#   Each tests job compiles its suites while `guest` builds, then takes `guest`'s parts once it
#   has ended.
#
#   and, in a full run:
#   build + packages (macos-aarch64,      guest         server, library, packages and their smoke,
#     windows-x86_64)                                   in one job; macOS' clippy too
#   build (linux-x86_64, linux-aarch64)   guest         server and library, in manylinux_2_28
#   packages (linux-x86_64, -aarch64)     its build     packages and their smoke, on ubuntu-22.04
#
# macOS has no lint or tests of its own: no runner here can boot a machine on it, and the
# machines virtx is written on are Macs.
#
# What a job builds it tests in the same job where it can. Two things cross between jobs, as
# artifacts of the run: the guest parts, which only Linux can build (its kernel is built in a
# Linux container, which neither macOS's runners, without Docker, nor Windows', with Windows
# containers, can run; abin's C is cross-compiled by a shell script, and alib is built in a
# container of each C library's image), and a Linux
# platform's build, which is made in a container and tried on the runner below its glibc. A
# cache only ever saves time here: a miss builds the thing again.
#
# For a release (`release: true`, with `full`) each platform's job also hands on what it packed
# and tried -- its servers' archives, its npm package and its wheel -- for `release` to attach.
#
# # Platforms
#
# | server         | client          | built on (see Runners)               | tried on         |
# |----------------|-----------------|--------------------------------------|------------------|
# | macos-aarch64  | darwin-arm64    | macos-15                             | the same job     |
# | windows-x86_64 | win32-x64-msvc  | windows-2025                         | the same job     |
# | linux-x86_64   | linux-x64-gnu   | ubuntu-26.04, in manylinux_2_28      | ubuntu-22.04     |
# | linux-aarch64  | linux-arm64-gnu | ubuntu-26.04-arm, in manylinux_2_28  | ubuntu-22.04-arm |
#
# # The glibc floor
#
# What is built for Linux runs on glibc 2.28 and later (RHEL 8, Debian 10, Ubuntu 20.04): it is
# built in a manylinux_2_28 container, because a binary needs the glibc of the headers it was
# compiled against. It links that glibc and nothing else a distribution ships at its own
# version: no OpenSSL (rustls on Linux), no libdrm, and Vulkan only opened at run time. Each
# Linux build checks it, and its packages are tried on ubuntu-22.04, below the build runners'
# glibc, so a build that needs more than its floor fails to open there.
#
# # Runners
#
# Every job is on GitHub's runners but one: `tests (windows-x86_64)`, which boots machines on the
# Windows hypervisor platform (WHP), which no GitHub runner has -- they have no nested
# virtualization. It asks for `[self-hosted, windows, x64, whp]`, which two kinds of brekkylab's
# own runners answer, whichever is free first:
#
# - a spot EC2 instance in ap-northeast-2 with nested virtualization (brekkylab/aws-ci-runners'
#   m8i-2xlarge), launched for the job and gone after it, its image with what the job would
#   install otherwise: the MSVC build tools, LLVM, Git's bash, rustup, sccache;
# - brekkylab0-windows, a machine of brekkylab's with a GPU (also labelled `gpu`), in a runner
#   group of virtx's alone, its tools under C:\ci. The job finds the GPU there itself and runs
#   the GPU's tests too.
#
# A fork's pull request has no Windows tests: ours hold brekkylab's caches, and that a fork's
# own workflow cannot ask for them is the repository's setting's to say -- a maintainer approves
# every outside contributor's run, after reading it.
#
# # Caches
#
# Rust is rust-cache's, saved from `main` alone, which every other ref restores. The kernel, abin,
# alib, MoltenVK and the GPU libraries `cargo xtask` builds for the servers' `gpu` feature are
# runs-on/cache's, which is GitHub's cache on GitHub's runners, each by what it is built from:
# a cache only ever saves time, and a miss builds the thing again. The GPU libraries' scripts
# skip a build their stamp says is done (.github/actions/gpu-deps).
#
# On ours, the Windows tests' rustc output is sccache's, and cargo's downloads are kept by
# `Cargo.lock` (.github/actions/cargo-deps), both in S3 beside the runners, at no transfer
# out of AWS.
name: pipeline

on:
  workflow_call:
    inputs:
      full:
        description: Build, pack and smoke every platform, rather than lint and test them
        type: boolean
        default: false
      release:
        description: Hand on what each platform packed, for a release to attach (with `full`)
        type: boolean
        default: false
    outputs:
      version:
        description: The version every manifest says
        value: ${{ jobs.version.outputs.version }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Not 0: a backtrace keeps its lines.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Neither rust-cache nor sccache keeps an incremental build.
  CARGO_INCREMENTAL: "0"

jobs:
  # The version the manifests say, which all of them say alike, and which a tag names. Every
  # build waits for it, so a tag the manifests do not match builds nothing.
  version:
    name: version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1

      - id: resolve
        name: Every manifest is one version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          toml() { sed -n 's/^version = "\(.*\)"$/\1/p' "$1" | head -1; }
          version=$(toml virtx-core/Cargo.toml)
          [ -n "$version" ] || { echo "::error::virtx-core/Cargo.toml has no version"; exit 1; }
          node=$(jq -r .version virtx-node/package.json)
          wrong=""
          [ "$node" = "$version" ] || wrong="$wrong virtx-node/package.json=$node"
          for f in virtx-rs/Cargo.toml virtx-py/pyproject.toml; do
            [ "$(toml "$f")" = "$version" ] || wrong="$wrong $f=$(toml "$f")"
          done
          # The `virtx-core` a published `virtx` depends on is the one released with it.
          dep=$(sed -n 's/^virtx-core = {.*version = "\([^"]*\)".*/\1/p' virtx-rs/Cargo.toml)
          [ "$dep" = "$version" ] || wrong="$wrong virtx-rs/Cargo.toml:virtx-core=$dep"
          [ -z "$wrong" ] || { echo "::error::virtx-core/Cargo.toml says $version, but:$wrong"; exit 1; }
          # Only these pre-releases have a PEP 440 form `publish` matches the wheels by.
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]] || {
            echo "::error::version $version is not X.Y.Z, X.Y.Z-alpha.N, X.Y.Z-beta.N or X.Y.Z-rc.N"; exit 1
          }
          if [ "$REF_TYPE" = tag ] && [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG, but the manifests say $version"; exit 1
          fi
          echo "virtx $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # `cargo xtask check`: the format, clippy of the client and the servers, the tests that boot
  # nothing, and the bindings' lint -- ruff, biome and tsc. It compiles the servers but runs
  # none, so it answers first. Its clippy is Linux's without `gpu`; each platform's build job
  # lints its own host's code with `gpu`.
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      # The guest init's cross-linker: clippy of the servers builds `virtx-uvm`, whose build
      # script builds the guest agent for musl.
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Add the guest's musl target
        run: cargo xtask init

      # The bindings' lint: ruff through uv, biome and tsc through npm.
      - uses: astral-sh/setup-uv@v10.3.3

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - run: cargo xtask check

  # The guest kernel for every platform of the architecture, abin and alib. Tarred before it is
  # handed on: an artifact keeps no file modes, and abin's programs have to stay executable.
  guest:
    name: guest (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            hosted: ubuntu-26.04
            targets: linux windows
            # The targets as a cache key takes them: a space there cuts the key short.
            kernels: linux-windows
          - arch: aarch64
            hosted: ubuntu-26.04-arm
            targets: linux macos
            kernels: linux-macos
    needs: version
    runs-on: ${{ matrix.hosted }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      # A kernel is only its tag, its config and this script, which pins both. runs-on/cache is
      # actions/cache on GitHub's runners, and keeps its entries in S3 on ours.
      - uses: runs-on/cache@3c223729b4fda74ee12f4976048dd69b420fdd26 # v5
        id: cache
        with:
          path: build/krunfw
          key: kernel-${{ matrix.arch }}-${{ matrix.kernels }}-${{ hashFiles('xtask/scripts/build-libkrunfw.sh') }}

      - name: Kernel
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          for target in ${{ matrix.targets }}; do
            echo "::group::libkrunfw for $target"
            LIBKRUNFW_TARGET=$target sh xtask/scripts/build-libkrunfw.sh
            echo "::endgroup::"
          done

      - run: ls -la build/krunfw

      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.arch }}-unknown-linux-musl
          components: clippy, rustfmt

      # abin is its crates, the toolchain, the scripts that cross-compile it, and xtask's
      # abin.rs, which runs them: not the rest of xtask.
      - uses: runs-on/cache@3c223729b4fda74ee12f4976048dd69b420fdd26 # v5
        id: abin
        with:
          path: target/release/abin
          key: abin-${{ matrix.arch }}-${{ hashFiles('virtx-abins/**', 'rust-toolchain.toml', 'xtask/scripts/musl-*.sh', 'xtask/scripts/fetch-musl-sysroot.sh', 'xtask/src/abin.rs') }}

      # Its tests too, here where it changed: they are built for the guest's musl target, which
      # this Linux host runs.
      - name: abin
        if: steps.abin.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm cmake ninja-build
          cargo xtask build abin
          cargo xtask test abin

      - run: ls -la target/release/abin

      # alib is only its script, which pins what it builds.
      - uses: runs-on/cache@3c223729b4fda74ee12f4976048dd69b420fdd26 # v5
        id: alib
        with:
          path: alib
          key: alib-${{ matrix.arch }}-${{ hashFiles('xtask/scripts/build-alib.sh') }}

      - name: alib
        if: steps.alib.outputs.cache-hit != 'true'
        run: sh xtask/scripts/build-alib.sh "$PWD/alib"

      - run: ls -laR alib

      - name: Hand the kernel, abin and alib on
        run: |
          mkdir -p guest/kernel
          cp -v build/krunfw/* guest/kernel/
          cp -R target/release/abin guest/abin
          cp -R alib guest/alib
          tar -cf guest-${{ matrix.arch }}.tar guest

      # To the jobs that use them, as an artifact of the run.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: guest-${{ matrix.arch }}
          path: guest-${{ matrix.arch }}.tar
          overwrite: true
          retention-days: 1

  # Each platform's lint: the client's clippy, and the servers' with `gpu`, as a release builds
  # them -- the `cfg`s `check`, on Linux and without `gpu`, never compiles. Every run has it, a
  # pull request's too, which builds nothing it would ship; `main`'s saves the caches it reads.
  # macOS has none: no runner here can test it, and the machines virtx is written on are
  # Macs. Its build lints it, on `main` and for a release.
  lint-windows:
    name: lint (windows-x86_64)
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: x86_64-unknown-linux-musl
          components: clippy, rustfmt

      - name: Toolchain
        run: |
          where.exe pkg-config.exe 2>/dev/null || choco install -y --no-progress pkgconfiglite
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: lint-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The GPU libraries `cargo xtask` builds for the servers' `gpu` feature.
      - uses: ./.github/actions/gpu-deps

      - name: Add the guest's musl target
        run: cargo xtask init

      - run: cargo xtask clippy --gpu

  lint-linux:
    name: lint (${{ matrix.release }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: linux-x86_64
            hosted: ubuntu-26.04
            arch: x86_64
          - release: linux-aarch64
            hosted: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.hosted }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.arch }}-unknown-linux-musl
          components: clippy, rustfmt

      # The guest init's cross-linker, bindgen's libclang, and meson with Vulkan's headers for
      # virglrenderer, which `--gpu` builds first.
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm libclang-dev meson ninja-build pkg-config python3-venv libvulkan-dev

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: lint-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The GPU libraries `cargo xtask` builds for the servers' `gpu` feature.
      - uses: ./.github/actions/gpu-deps

      - name: Add the guest's musl target
        run: cargo xtask init

      - run: cargo xtask clippy --gpu

  # macOS and Windows: `virtx-stdio` and `virtx-server-tcp`, each archived with the kernel, abin
  # and alib; `libvirtx_core`; and the platform's packages packed from them and tried, all on one
  # runner.
  build-native:
    name: build + packages (${{ matrix.release }})
    needs: [version, guest]
    if: inputs.full
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: macos-aarch64
            platform: darwin-arm64
            hosted: macos-15
            arch: aarch64
            target: aarch64-apple-darwin
            file: libvirtx_core.dylib
          - release: windows-x86_64
            platform: win32-x64-msvc
            hosted: windows-2025
            arch: x86_64
            target: x86_64-pc-windows-msvc
            file: virtx_core.dll
    runs-on: ${{ matrix.hosted }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      # Before any checkout: Windows' git converts to CRLF, and the GPU libraries' builds run
      # shell scripts written against LF.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.arch }}-unknown-linux-musl, ${{ matrix.target }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: native-${{ matrix.release }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install lld llvm meson ninja

      # pkg-config.exe for build-deps.ps1, which PowerShell runs (Git Bash's is not an .exe),
      # and libclang for bindgen.
      - name: Toolchain (Windows)
        if: runner.os == 'Windows'
        run: |
          where.exe pkg-config.exe 2>/dev/null || choco install -y --no-progress pkgconfiglite
          where.exe pkg-config.exe
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      # The GPU libraries `cargo xtask` builds for the servers' `gpu` feature.
      - uses: ./.github/actions/gpu-deps

      - name: Add the guest's musl target
        run: cargo xtask init

      # MoltenVK takes most of a macOS build, and changes only with its two submodules and its
      # script.
      - name: MoltenVK cache
        if: runner.os == 'macOS'
        uses: runs-on/cache@3c223729b4fda74ee12f4976048dd69b420fdd26 # v5
        with:
          path: 3rdparty/MoltenVK/Package
          key: moltenvk-${{ hashFiles('.git/modules/MoltenVK/HEAD', '.git/modules/SPIRV-Cross/HEAD', 'xtask/scripts/build-moltenvk.sh') }}

      - uses: ./.github/actions/guest
        with:
          arch: ${{ matrix.arch }}

      # macOS links the kernel.c the Linux job built; Windows takes the library as it is. alib
      # stays in `guest/`, named as virtx's cache to the server build and `archive`, which take
      # it from `alib/` there -- to those two steps only: the packages' smoke keeps a cache of
      # its own.
      - name: Put the kernel, abin and alib in place
        run: |
          tar -xf guest-${{ matrix.arch }}.tar
          mkdir -p build/krunfw "$CARGO_TARGET_DIR/release"
          case "${{ matrix.release }}" in
            macos-*)   LIBKRUNFW_KERNEL_C="$PWD/guest/kernel/kernel.c" cargo xtask build kernel ;;
            windows-*) cp -v guest/kernel/libkrunfw.dll build/krunfw/ ;;
          esac
          rm -rf "$CARGO_TARGET_DIR/release/abin" "$CARGO_TARGET_DIR/release/alib"
          cp -R guest/abin "$CARGO_TARGET_DIR/release/"
          home="$PWD/guest"
          if [ "$RUNNER_OS" = Windows ]; then home=$(cygpath -w "$home"); fi
          echo "GUEST_HOME=$home" >> "$GITHUB_ENV"
          ls -la build/krunfw "$CARGO_TARGET_DIR/release/abin" guest/alib

      - name: Servers
        run: VIRTX_HOME="$GUEST_HOME" cargo xtask build server-stdio server-tcp --locked

      # macOS' lint, which has no lint job of its own (see `lint-windows`). The GPU libraries
      # are the server build's, already there.
      - name: Clippy, with gpu (macOS)
        if: runner.os == 'macOS'
        run: cargo xtask clippy --gpu

      - name: virglrenderer's log (Windows, on failure)
        if: failure() && runner.os == 'Windows'
        run: |
          log=build/virglrenderer-build.log
          [ -f "$log" ] || { echo "no $log"; exit 0; }
          # Windows PowerShell writes a redirect as UTF-16.
          iconv -f UTF-16 -t UTF-8 "$log" > "$log.txt" 2>/dev/null || tr -d '\000' < "$log" > "$log.txt"
          grep -nE -B3 -A6 "^FAILED|error( [A-Z]+[0-9]+)?:" "$log.txt" | head -100
          tail -30 build/virglrenderer-build/meson-logs/meson-log.txt 2>/dev/null || true

      # Nothing Windows may lack is loaded at start-up: the C++ runtime is linked in and the rest
      # delay-loaded, so a host without them runs a server far enough to say what to install.
      - name: Servers' DLL imports (Windows)
        if: runner.os == 'Windows'
        run: |
          for f in "$CARGO_TARGET_DIR/release/virtx-stdio.exe" "$CARGO_TARGET_DIR/release/virtx-server-tcp.exe"; do
            echo "$f:"
            "/c/Program Files/LLVM/bin/llvm-readobj.exe" --coff-imports "$f" \
              | awk '/^Import \{/{k="load"} /^DelayImport \{/{k="delay"} /Name: .*\.dll/{print "  " k ": " $2}' \
              | sort -u | tee "$RUNNER_TEMP/imports.txt"
            if grep -iE "load: (vcruntime|msvcp|vulkan-1|winhv)" "$RUNNER_TEMP/imports.txt"; then
              echo "::error::$f needs the DLLs above to start"; fail=1
            fi
          done
          exit ${fail:-0}

      - name: Archive
        run: |
          VIRTX_HOME="$GUEST_HOME" cargo xtask archive --with-abin
          mkdir -p dist/release
          cp -v "$CARGO_TARGET_DIR/release/dist/virtx-stdio-${{ matrix.release }}.tar.gz" \
            "$CARGO_TARGET_DIR/release/dist/virtx-server-tcp-${{ matrix.release }}.tar.gz" dist/release/

      - name: libvirtx_core
        env:
          # The oldest macOS the wheel's tag says it runs on.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo xtask build client --locked --target ${{ matrix.target }}
          mkdir -p dist/lib/${{ matrix.platform }}
          cp "$CARGO_TARGET_DIR/${{ matrix.target }}/release/${{ matrix.file }}" dist/lib/${{ matrix.platform }}/
          ls -la dist/lib/${{ matrix.platform }}

      # No DLL Windows does not ship: the C runtime is linked in (`.cargo/config.toml`).
      - name: Library's DLL imports (Windows)
        if: runner.os == 'Windows'
        run: |
          f=dist/lib/${{ matrix.platform }}/${{ matrix.file }}
          "/c/Program Files/LLVM/bin/llvm-readobj.exe" --coff-imports "$f" \
            | awk '/^Import \{/{k="load"} /^DelayImport \{/{k="delay"} /Name: .*\.dll/{print "  " k ": " $2}' \
            | sort -u | tee "$RUNNER_TEMP/imports.txt"
          if grep -iE "load: (vcruntime|msvcp)" "$RUNNER_TEMP/imports.txt"; then
            echo "::error::$f needs the DLLs above to load"; exit 1
          fi

      - uses: ./.github/actions/packages
        with:
          version: ${{ needs.version.outputs.version }}
          platform: ${{ matrix.platform }}

      - if: inputs.release
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/release/virtx-stdio-${{ matrix.release }}.tar.gz
            dist/release/virtx-server-tcp-${{ matrix.release }}.tar.gz
            dist/release/brekkylab-virtx-${{ matrix.platform }}-*.tgz
            dist/release/*.whl
          overwrite: true
          retention-days: 1

  # Linux: `virtx-stdio`, `virtx-server-tcp` and `libvirtx_core`, built in manylinux_2_28 and handed to
  # `packages-linux` to be packed and tried below the build runners' glibc.
  build-linux:
    name: build (${{ matrix.release }})
    needs: guest
    if: inputs.full
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: linux-x86_64
            platform: linux-x64-gnu
            hosted: ubuntu-26.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - release: linux-aarch64
            platform: linux-arm64-gnu
            hosted: ubuntu-26.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            arch: aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.hosted }}
    container: ${{ matrix.container }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.arch }}-unknown-linux-musl, ${{ matrix.target }}
          components: clippy, rustfmt

      # No compiler cache: rust-cache keeps the runner's, not the container's, and this job runs
      # for `main` and releases alone.

      # AlmaLinux's packages and the image's own Python, for meson and virglrenderer's
      # generators. The image sets PKG_CONFIG_PATH, which `.cargo/config.toml`'s [env] does not
      # override, so virglrenderer's goes in front of it here. zstd: the cache compresses with it.
      - name: Toolchain
        run: |
          dnf -y -q install clang clang-devel llvm lld vulkan-headers vulkan-loader-devel zstd
          py=/opt/python/cp312-cp312/bin
          "$py/pip" install -q --root-user-action=ignore meson~=1.12 ninja~=1.13 pyyaml~=6.0 mako~=1.4
          echo "$py" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$PWD/build/virglrenderer/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Add the guest's musl target
        run: cargo xtask init

      - uses: actions/download-artifact@v8.0.2
        with:
          name: guest-${{ matrix.arch }}

      # alib stays in `guest/`, named as virtx's cache to the server build and `archive`.
      - name: Put the kernel, abin and alib in place
        run: |
          tar -xf guest-${{ matrix.arch }}.tar
          mkdir -p build/krunfw target/release
          cp -v guest/kernel/libkrunfw.so.* build/krunfw/
          cp -R guest/abin target/release/
          ls -la build/krunfw target/release/abin guest/alib

      - name: Servers
        run: VIRTX_HOME="$PWD/guest" cargo xtask build server-stdio server-tcp --locked

      - name: libvirtx_core
        run: cargo xtask build client --locked --target ${{ matrix.target }}

      # `__isoc23_*` is glibc 2.38's and comes in unversioned, so the version alone would not show it.
      - name: The glibc floor
        run: |
          for f in target/release/virtx-stdio target/release/virtx-server-tcp target/${{ matrix.target }}/release/libvirtx_core.so; do
            syms=$(objdump -T "$f")
            need=$(grep -oE 'GLIBC_2\.[0-9]+' <<<"$syms" | sort -t. -k2 -n -u | tail -1)
            libs=$(objdump -p "$f" | awk '/NEEDED/{print $2}' | tr '\n' ' ')
            echo "$f needs $need; links $libs"
            [ "${need#GLIBC_2.}" -le 28 ] || { echo "::error::$f needs $need, above glibc 2.28"; fail=1; }
            if grep -q __isoc23_ <<<"$syms"; then echo "::error::$f references __isoc23_*"; fail=1; fi
            if printf '%s' "$libs" | grep -qE 'libssl|libcrypto'; then echo "::error::$f links OpenSSL"; fail=1; fi
          done
          exit ${fail:-0}

      - name: Hand the build on
        run: |
          VIRTX_HOME="$PWD/guest" cargo xtask archive --with-abin
          mkdir -p built/dist/release built/dist/lib/${{ matrix.platform }}
          cp -v target/release/dist/virtx-stdio-${{ matrix.release }}.tar.gz \
            target/release/dist/virtx-server-tcp-${{ matrix.release }}.tar.gz built/dist/release/
          cp -v target/${{ matrix.target }}/release/libvirtx_core.so built/dist/lib/${{ matrix.platform }}/

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-${{ matrix.platform }}
          path: built/
          overwrite: true
          retention-days: 1

  # A Linux platform's packages, packed from what `linux` built and tried on ubuntu-22.04,
  # below the build runners' glibc.
  packages-linux:
    name: packages (${{ matrix.release }})
    needs: [version, build-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: linux-x86_64
            platform: linux-x64-gnu
            runner: ubuntu-22.04
          - release: linux-aarch64
            platform: linux-arm64-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          name: linux-${{ matrix.platform }}

      - uses: ./.github/actions/packages
        with:
          version: ${{ needs.version.outputs.version }}
          platform: ${{ matrix.platform }}

      - if: inputs.release
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/release/virtx-stdio-${{ matrix.release }}.tar.gz
            dist/release/virtx-server-tcp-${{ matrix.release }}.tar.gz
            dist/release/brekkylab-virtx-${{ matrix.platform }}-*.tgz
            dist/release/*.whl
          overwrite: true
          retention-days: 1

  # `cargo xtask test` with the servers built here: the crates' own tests, then the packages'
  # against the fixture, each booting machines, on KVM, which GitHub's Linux x86_64 runners have.
  #
  # Like the Windows tests, it starts with the run rather than after `guest`: it compiles all
  # of it while `guest` builds, then takes the kernel and abin once `guest` has ended.
  tests-linux:
    name: tests (linux-x86_64)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      # What building the servers takes on this host: the guest init's cross-linker, bindgen's
      # libclang, and meson with Vulkan's headers for virglrenderer.
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm libclang-dev meson ninja-build pkg-config python3-venv libvulkan-dev

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: tests-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The GPU libraries `cargo xtask` builds for the servers' `gpu` feature.
      - uses: ./.github/actions/gpu-deps

      - name: Add the guest's musl target
        run: cargo xtask init

      # GitHub's runner has KVM, but /dev/kvm is root's until a rule says otherwise.
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      # Everything `cargo xtask test` compiles, which needs no kernel.
      - name: Compile the tests
        run: cargo xtask test --no-run

      # `guest (x86_64)`'s, once it has ended; this job ends with it if it fails.
      - uses: ./.github/actions/guest
        with:
          arch: x86_64
          wait: true
          token: ${{ github.token }}

      # And abin, which the fixture would build again otherwise (`XTASK_ABIN_BUILT`).
      - name: Put the kernel and abin in place
        run: |
          tar -xf guest-x86_64.tar
          mkdir -p build/krunfw target/release
          cp -v guest/kernel/libkrunfw.so.* build/krunfw/
          cp -R guest/abin target/release/abin
          echo XTASK_ABIN_BUILT=1 >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v10.3.3

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - run: cargo xtask test

  # The machine-booting crates' tests on Windows, over WHP, on a runner of our own: GitHub's
  # Windows runners have no hypervisor (see Runners). Any runner labelled `whp` takes it -- a
  # spot instance of aws-ci-runners, launched for the job, or brekkylab's own machine with a
  # GPU, whichever is free first. Where the job finds a GPU (see `This runner`), the GPU's tests
  # run too: the GPU libraries built, and `virtx-uvm` tested with its `gpu` feature. Each machine's RAM is prefaulted (`VIRTX_PREFAULT_MEMORY`): nested, the
  # faults a guest takes as it first touches its memory are most of a boot.
  #
  # It starts with the run rather than after `guest`, and takes the kernel from it once it has
  # compiled its tests and `guest` has ended: a new runner's boot (about four minutes) and the
  # compile happen while the kernel is built, not after.
  tests-windows:
    name: tests (windows-x86_64)
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: [self-hosted, windows, x64, whp]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: read
    env:
      VIRTX_PREFAULT_MEMORY: "1"
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt

      # What this runner is: sccache's where it has its bucket (aws-ci-runners'), but for a
      # release, which compiles from nothing; and the GPU's tests where it has a GPU -- a
      # display controller on its PCI bus that is not Windows' own basic one, and Vulkan's
      # loader to reach it with. Found here rather than told: a job cannot read its runner's
      # labels, and a runner that is told can be told wrong.
      - id: runner
        name: This runner
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "${SCCACHE_BUCKET:-}" ] && [ "$RELEASE" != true ]; then
            echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV"
          fi
          cat > "$RUNNER_TEMP/gpu.ps1" <<'PS'
          $found = Get-CimInstance Win32_VideoController |
            Where-Object { $_.PNPDeviceID -like 'PCI\*' -and $_.Name -notmatch 'Microsoft Basic' } |
            ForEach-Object { $_.Name }
          if ($found -and (Test-Path "$env:SystemRoot\System32\vulkan-1.dll")) { $found -join ', ' }
          PS
          gpu=$(powershell -NoProfile -ExecutionPolicy Bypass -File "$RUNNER_TEMP/gpu.ps1" | tr -d '\r')
          if [ -n "$gpu" ]; then
            echo "gpu=true" >> "$GITHUB_OUTPUT"
            echo "VIRTX_TEST_GPU=1" >> "$GITHUB_ENV"
            echo "TEST_FEATURES=--features virtx-uvm/gpu" >> "$GITHUB_ENV"
          fi
          echo "sccache: ${SCCACHE_BUCKET:+yes}; GPU: ${gpu:-none}"

      - uses: ./.github/actions/cargo-deps

      # The GPU libraries `virtx-uvm`'s `gpu` feature links, on a runner with a GPU.
      - if: steps.runner.outputs.gpu
        uses: ./.github/actions/gpu-deps

      - name: GPU libraries
        if: steps.runner.outputs.gpu
        run: powershell -NoProfile -ExecutionPolicy Bypass -File xtask/scripts/build-deps.ps1

      - name: Add the guest's musl target
        run: cargo xtask init

      # What `cargo xtask test` below builds first, which needs no kernel.
      - name: Compile the tests
        run: cargo test --no-run --release -p virtx-uvm -p virtx-server-tcp -p virtx-server-stdio $TEST_FEATURES

      # `guest (x86_64)`'s, once it has ended; this job ends with it if it fails.
      - uses: ./.github/actions/guest
        with:
          arch: x86_64
          wait: true
          token: ${{ github.token }}

      - name: Put the kernel in place
        run: |
          tar -xf guest-x86_64.tar
          mkdir -p build/krunfw
          cp -v guest/kernel/libkrunfw.dll build/krunfw/

      - run: cargo xtask test --release -p virtx-uvm -p virtx-server-tcp -p virtx-server-stdio $TEST_FEATURES -- --include-ignored
