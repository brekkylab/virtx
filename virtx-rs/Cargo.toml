[package]
name = "virtx-rs"
version = "0.1.2"
edition = "2024"
description = "A virtx client for Rust, over libvirtx_core's C ABI."
license = "Apache-2.0"
publish = false

[dependencies]
# The types every request takes and answers, and nothing of the client: that is the one in
# `libvirtx_core`, opened at run time, so a process with other modules over it shares one.
virtx-core = { path = "../virtx-core", default-features = false }
# Opening `libvirtx_core` and finding its functions.
libloading = "0.8"
# `Stream`, which a request answering item by item is.
futures-core = "0.3"
# What crosses the C ABI is CBOR.
ciborium = "0.2"
serde = "1"
# A file's contents, as `virtx-core` reads them.
bytes = "1"

[dev-dependencies]
# The server the tests spawn: the test binary itself, serving `virtx-core`'s stdio transport.
virtx-core = { path = "../virtx-core", default-features = false, features = ["transport"] }
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
futures-util = { version = "0.3", default-features = false }

[[test]]
# Its own `main`, which serves when spawned as the server and runs the tests otherwise.
name = "client"
harness = false
