[package]
name = "virtx-core"
version = "0.2.1"
edition = "2024"
description = "The virtx client: the types every request takes and answers, the wire, and the C ABI of libvirtx_core."
license = "Apache-2.0"
repository = "https://github.com/brekkylab/virtx"
readme = "README.md"
homepage = "https://virtx.sh"
documentation = "https://docs.rs/virtx-core"
keywords = ["vm", "microvm", "sandbox", "agent", "virtualization"]
categories = ["virtualization", "api-bindings"]

[lib]
# `rlib` alone: the library for C, `libvirtx_core`, is `virtx-cabi`'s.
crate-type = ["rlib"]

[dependencies]
# What the types need, and all they need: a crate that only names requests and their answers
# (`virtx`, the Rust client in `virtx-rs/`, which reaches the library through the C ABI) takes `default-features = false`.
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# Every body is JSON, and a log entry is read as one before it is told a kind this version knows.
serde_json = "1"

# The wire: HTTP/2 over TCP or over a child's stdio, a refusal, a job's log as an event stream
# and a WebSocket, both ends of it. A log's entry is always built; the client's end is `client`,
# the server's `server`.
http-over-x = { workspace = true }
# The server's release archive, fetched when this host has none, and signing in from the
# `virtx` command. The same reqwest 0.13 and rustls the `virtx` crate uses.
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
# The requests and responses the wire carries, and the server's end of a request.
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
# A job's log answered with its exec, read as SSE.
sse-stream = { version = "0.2", optional = true }
# `Stream`, which a job's log is, and the macro that writes one.
futures-util = { version = "0.3", default-features = false, features = ["alloc", "sink"], optional = true }
async-stream = { version = "0.3", optional = true }
# A session brings its own runtime, since C calls in without one. `rt-multi-thread` so the
# session's tasks run between C calls, not only inside one.
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"], optional = true }
# An image downloaded or uploaded is an OCI image layout in a tar archive, each blob's digest
# checked as it is read.
tar = { version = "0.4", default-features = false, optional = true }
sha2 = { version = "0.10", optional = true }
# The server's release archive, fetched when this host has none, is a tar.gz, checked against
# the release's SHA256SUMS.
flate2 = { version = "1", optional = true }
# The `virtx` command's arguments.
clap = { version = "4", features = ["derive", "env"], optional = true }
# Signing in from the `virtx` command: an ID token's claims, read for when it runs out.
base64 = { version = "0.22", optional = true }

[target.'cfg(unix)'.dependencies]
# `signal(SIGPIPE, SIG_DFL)`, so `virtx images | head` ends quietly.
libc = { version = "0.2", optional = true }

[build-dependencies]
# Writes `include/virtx.h` from `src/ffi.rs`.
cbindgen = { version = "0.29", default-features = false }

[dev-dependencies]
# What serves the transport tests' routers, over HTTP/2 and in the test's own process.
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio", "ws"] }
# Names no two of the ensure tests' scratch directories alike.
uuid = { version = "1", features = ["v4"] }
# A test of how long a request is sent again for runs on a clock it moves on itself.
tokio = { version = "1", features = ["test-util"] }
# The transport tests serve as well as call, so a bare `cargo test` builds the server's end. A
# dev dependency's features reach no build but the tests'.
virtx-core = { path = ".", features = ["server"] }

[features]
# The types (`image`, `volume`, the methods' args and outputs) are always built. `client` adds
# the wire's client end, `server` its server end, and `ffi` the C ABI over a client, which is
# what `libvirtx_core` is built for. `cli` adds the `virtx` command, which the bindings run
# through `virtx_cli_main`.
default = ["ffi", "cli"]
client = [
    "http-over-x/client",
    "http-over-x/webdav",
    "dep:reqwest",
    "dep:bytes",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:sse-stream",
    "dep:futures-util",
    "dep:async-stream",
    "dep:tokio",
    "dep:tar",
    "dep:flate2",
    "dep:sha2",
]
server = ["http-over-x/server"]
ffi = ["client"]
# For other crates' tests alone: `Client::embed`, a client of a server served in the test's own
# process. Taken only as a dev-dependency's feature, it is in no build but a test's.
test-util = ["client", "http-over-x/server"]
cli = [
    "client",
    "dep:clap",
    "dep:libc",
    "tokio/signal",
    # Signing in: the provider's discovery document, device flow and tokens, asked before the
    # command's runtime starts.
    "reqwest/json",
    "reqwest/form",
    "reqwest/blocking",
    "dep:base64",
]
