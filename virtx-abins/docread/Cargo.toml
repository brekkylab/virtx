[package]
name = "virtx-exec-docread"
version.workspace = true
edition.workspace = true
license.workspace = true

# `docread` is what a caller types, and the package name is not it: this is one program, and
# the name it answers to is the one in its usage line and in everything it says about itself.
[[bin]]
name = "docread"
path = "src/main.rs"

[dependencies]
# The command line, and where `--help` comes from.
clap = { workspace = true }

# The readers and the DocLang they are written out as. Pinned exactly: what a block is, and so
# what `-o` counts, is docling's serializer, and a new version of it is a change to the numbers a
# caller quoted.
#
# `pdf` is the PDF pipeline with its models: the layout model finds headings, tables and
# pictures on a page, and TableFormer a table's cells. The models are files beside the program,
# not in it. The other default features are left off: OCR's and ASR's models, and the network
# (`ureq`, for URLs and remote images).
docling = { version = "=2.86.14", default-features = false, features = ["pdf"] }

# ONNX Runtime, which the models run on. `disable-linking` because `ort-sys` would otherwise
# download a prebuilt one, and there is none for musl: `build.rs` builds it and links it in.
ort-sys = { version = "=2.0.0-rc.15", default-features = false, features = ["disable-linking"] }

# Cutting docling's DocLang into the top-level blocks a window counts. The version docling's own
# reader is built with, so the build has one.
quick-xml = "0.41"

[build-dependencies]
# Checking what `build.rs` fetches: the ONNX Runtime source by its sha512, and the `protoc` it
# needs by the sha1 its own dependency list pins.
sha1 = "0.10"
sha2 = "0.10"
# Unpacking that `protoc`, which comes as a zip.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = { workspace = true }
# Writes the Word documents the tests read, so no `.docx` is checked into this repository.
docx-rs = "0.4.22"
