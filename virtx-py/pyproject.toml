[build-system]
requires = ["setuptools>=80", "setuptools-rust>=1.13"]
build-backend = "setuptools.build_meta"

[project]
name = "virtx"
version = "0.2.1"
# The repository's README, linked here: setuptools reads nothing outside this directory.
readme = "README.md"
description = "A virtx client for Python, over libvirtx_core's C ABI."
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["vm", "microvm", "sandbox", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Emulators",
    "Typing :: Typed",
]
# What crosses the C ABI is JSON, and the C ABI itself is reached with ctypes, so the package
# depends on nothing: a wheel is the Python files and `libvirtx_core` for its platform.
dependencies = []

[project.urls]
Homepage = "https://virtx.sh"
Documentation = "https://virtx.sh/docs"
Repository = "https://github.com/brekkylab/virtx"
Issues = "https://github.com/brekkylab/virtx/issues"
Changelog = "https://github.com/brekkylab/virtx/releases"

[project.scripts]
# `libvirtx_core`'s `virtx` command, as the `virtx-cli` binary is.
virtx = "virtx._cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff==0.17.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
virtx = ["py.typed"]

# `libvirtx_core`, built by cargo from `virtx-cabi` and put in the package as `virtx._virtx_core`,
# named as an extension module is, for `_library.py` to open with ctypes: in `dev` for an
# editable install, in `release` for a wheel.
[[tool.setuptools-rust.ext-modules]]
target = "virtx._virtx_core"
path = "../virtx-cabi/Cargo.toml"
binding = "NoBinding"

# The library is no CPython extension, so one wheel serves every Python the package does.
[tool.distutils.bdist_wheel]
py-limited-api = "cp311"

[tool.uv]
# An editable install carries the library built from the crates, so it is built again when they
# change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "../Cargo.lock" },
    { file = "../virtx-cabi/**" },
    { file = "../virtx-core/Cargo.toml" },
    { file = "../virtx-core/build.rs" },
    { file = "../virtx-core/src/**/*.rs" },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
