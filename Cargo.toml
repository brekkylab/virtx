# The four halves of cortex-krun, kept apart because they are built apart.
#
# `cortex-krun-lib` is the whole of the machinery -- images, disks, sessions --
# and links libkrun. `cortex-krun` is what a user runs and what answers a
# console; it holds no hypervisor. `cortex-krun-host` is the process that
# becomes a micro-VM, spawned as a file beside `cortex-krun` rather than
# depended on by it, because on macOS creating a VM needs an entitlement, an
# entitlement is carried by a code signature, and a signature is read at `exec`
# -- so the process that creates a VM can never be the process that decided to.
# `cortex-krun-guest` is the init that runs inside one.
[workspace]
resolver = "3"
members = ["cortex-krun", "cortex-krun-host", "cortex-krun-lib"]

# `3rdparty/libkrun/` is the vendored libkrun submodule, which is its own cargo
# workspace. Without this, cargo would auto-adopt the path dependencies as
# members and collide with that workspace.
#
# `cortex-krun-guest/` and `cortex-abins/` are workspace roots of their own: both are
# cross-compiled to `*-unknown-linux-musl`, and a member would be built for the host
# by a bare `cargo build` -- for a target that has no host to run on. Listed here and
# not merely left out of `members`: a package under this directory that is neither
# resolves against this root, and the ones in `cortex-abins/` inherit dependencies
# this workspace has no reason to declare.
exclude = ["3rdparty/libkrun", "cortex-krun-guest", "cortex-abins"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# 1.89 for `std::fs::File::lock`, which guards `index.json` against concurrent pulls.
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
# The console protocol the server answers and the guest speaks: the frames, the calls and
# the codes a refusal carries. A path to the sibling checkout, because the two repositories
# are developed together -- `cortex` is what decides what a session *is*, and this one is one
# backend for it.
#
# No default features: what is wanted is the console, and every binding cortex offers brings
# a libfuse provider or an HTTP stack with it.
cortex = { path = "../cortex/cortex", default-features = false }
cortex-krun-host = { path = "cortex-krun-host", default-features = false }
cortex-krun-lib = { path = "cortex-krun-lib" }
# The wire's codec, which `cortex` already carries in its public API: two versions of it in
# one build would be a type error nobody could read.
bson = { version = "3", features = ["serde"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
tokio = "1"

# rutabaga_gfx 0.1.85 on crates.io predates the Darwin sys layer (merged
# 2026-09-02) and routes macOS to a stub backend that panics at runtime.
# Track the repo until a release carries it.
[patch.crates-io]
rutabaga_gfx = { path = "3rdparty/rutabaga_gfx" }
magma-gpu = { path = "3rdparty/rutabaga_gfx/third_party/mesa3d/src/virtio/magma-gpu-rs/lib" }

# The boot half is stripped by `scripts/macos-link.sh`, not by rustc. rustc strips a
# release binary *after* the linker returns, and on macOS that rewrites the signature
# the script just applied -- dropping the hypervisor entitlement with it. Stripping
# inside the script, before `codesign`, keeps the one order that works.
[profile.release.package.cortex-krun-host]
strip = "none"
