# Cross-linking a Linux/musl static binary from a macOS or Windows host: the system `cc` cannot
# produce an ELF, so link with the `rust-lld` that ships with the toolchain instead of looking
# for a musl-gcc that is not there.
[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "linker=rust-lld"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "linker=rust-lld"]
