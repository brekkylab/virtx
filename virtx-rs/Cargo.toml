[package]
name = "virtx"
version = "0.1.2"
edition = "2024"
description = "A virtx client for Rust, over libvirtx_core's C ABI."
license = "Apache-2.0"
repository = "https://github.com/brekkylab/virtx"

[features]
# The client linked into this crate, so that `cargo add virtx` is all a Rust program needs. Off,
# `libvirtx_core` is opened at run time -- `load`, `$VIRTX_CORE_LIB`, or the system loader's
# search -- so that a process with other modules over it (the Python or Node package) shares one.
default = ["embedded"]
embedded = ["virtx-core/ffi"]

[dependencies]
# The types every request takes and answers; and, with `embedded`, the client behind the C ABI.
# The version is what a published `virtx` depends on, and is the one both crates say.
virtx-core = { path = "../virtx-core", version = "0.1.2", default-features = false }
# Opening `libvirtx_core` and finding its functions, without `embedded`.
libloading = "0.8"
# `Stream`, which a request answering item by item is.
futures-core = "0.3"
# What crosses the C ABI is JSON.
serde_json = "1"
serde = "1"

[dev-dependencies]
# A runtime to call in from, as a program with one does.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
