[package]
name = "virtx-http-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The server, on `virtx-core`'s protocol over HTTP, to the users and projects its config names.
[features]
gpu = ["virtx-uvm/gpu"]

[dependencies]
anyhow = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
clap = { version = "4", features = ["derive"] }
http = "1"
serde = { workspace = true }
serde_json = "1"
sha2 = "0.10"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
# A token's randomness.
uuid = { version = "1", features = ["v4"] }
# The server end of `/rpc`.
virtx-core = { workspace = true, features = ["server"] }
# The methods, and the machines they start.
virtx-uvm = { workspace = true }

[dev-dependencies]
# The wire, spoken by hand: virtx-core's client sends no token and names no project.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio = { workspace = true, features = ["io-util", "process"] }
