# The tests, after `build`; `ci` and `release` call it.
#
# - `check`: `cargo xtask check`: the format, clippy of the client and the servers, and the
#   tests that boot nothing. It compiles the servers but runs none, so it answers first.
# - `suites`: `cargo xtask test` with the servers built here: the crates' own tests, then the
#   packages' against the fixture, each booting machines. Linux x86_64, the one runner GitHub
#   gives a hypervisor on; the guest kernel is the one `build` made.
# - `suites-windows`: the machine-booting crates' tests on Windows, over WHP, which no GitHub
#   runner has. They run on `virtx-windows-ci`, an EC2 instance of our own with nested
#   virtualization, registered to this repository: `windows-runner` starts it, and it stops
#   itself once no job has run on it for 20 minutes. A fork's pull request has no AWS role to
#   start it with, and does not ask; that a fork's workflow cannot reach the runner while it is
#   up is the repository's fork approval setting's to say, not this file's.
#
#   What the runner has to have, for whoever builds it again (from the `virtx-windows-ci-*`
#   AMI, which has all of it): WHP on (`HypervisorPlatform`, and nested virtualization on the
#   instance); the MSVC build tools, LLVM at `C:\Program Files\LLVM`, Git with its `bin` on
#   PATH (`shell: bash`, and actions written as bash), rustup, pkg-config.
# - `packages`: on each platform, the npm packages installed from a registry on localhost and
#   the wheel pip picks, each opening the library it carries; then the server that library
#   fetches, from a release layout served on localhost, started and asked to answer.
#
# `packages` runs Linux on ubuntu-22.04, below the build runners' glibc, so a build that needs
# more than its floor fails to open here.
name: test

on:
  workflow_call:
    inputs:
      version:
        description: The version `build` built
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: check

      # The guest init's cross-linker: clippy of the servers builds `virtx-uvm`, whose build
      # script builds the guest agent for musl.
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm

      - name: Add the guest's musl target
        run: cargo xtask init

      - run: cargo xtask check

  suites:
    name: suites (linux-x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: suites

      # What building the servers takes on this host: the guest init's cross-linker, bindgen's
      # libclang, and meson with Vulkan's headers for virglrenderer.
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm libclang-dev meson ninja-build pkg-config python3-venv libvulkan-dev

      - name: Add the guest's musl target
        run: cargo xtask init

      # The runner has KVM, but /dev/kvm is root's until a rule says otherwise.
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - uses: actions/download-artifact@v8
        with:
          name: guest-x86_64

      - name: Put the kernel in place
        run: |
          tar -xf handoff.tar
          mkdir -p build/krunfw
          cp -v handoff/kernel/libkrunfw.so.* build/krunfw/

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: cargo xtask test

  # Starts `virtx-windows-ci`, whose runner then takes `suites-windows`. Starting a running
  # instance does nothing, so runs that overlap share it; one that finds it stopping waits for
  # it to stop first, which is the only state it cannot be started from.
  windows-runner:
    name: start the Windows runner
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.WINDOWS_CI_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Start it
        run: |
          read -r id state < <(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=virtx-windows-ci \
                      Name=instance-state-name,Values=pending,running,stopping,stopped \
            --query 'Reservations[0].Instances[0].[InstanceId,State.Name]' --output text)
          echo "virtx-windows-ci: $id, $state"
          if [ "$state" = stopping ]; then aws ec2 wait instance-stopped --instance-ids "$id"; fi
          aws ec2 start-instances --instance-ids "$id" --output text
          aws ec2 wait instance-running --instance-ids "$id"

  # The guest kernel is `build`'s, as for `suites`. The target directory is outside the
  # checkout, so it outlives the run on the instance's own disk: the next run builds what
  # changed and not the world. Each machine's RAM is prefaulted (`VIRTX_PREFAULT_MEMORY`):
  # nested, the faults a guest takes as it first touches its memory are most of a boot.
  suites-windows:
    name: suites (windows-x86_64)
    needs: windows-runner
    runs-on: [self-hosted, virtx-windows-ci]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: C:\virtx-ci\target
      VIRTX_PREFAULT_MEMORY: "1"
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          submodules: true

      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - uses: actions/download-artifact@v8
        with:
          name: guest-x86_64

      - name: Put the kernel in place
        run: |
          tar -xf handoff.tar
          mkdir -p build/krunfw
          cp -v handoff/kernel/libkrunfw.dll build/krunfw/

      - name: Add the guest's musl target
        run: cargo xtask init

      - run: cargo xtask test --release -p virtx-uvm -p virtx-server-tcp -p virtx-server-stdio -- --include-ignored --test-threads 1

  packages:
    name: packages (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: linux-x64-gnu
            runner: ubuntu-22.04
          - platform: linux-arm64-gnu
            runner: ubuntu-22.04-arm
          - platform: win32-x64-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/packages

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: bundle
          path: dist/release

      # Published with an explicit --registry and a config of its own: the packages'
      # publishConfig names npmjs, and nothing here may reach it. Verdaccio is installed on its
      # own first: on Windows the install alone can outlast the wait for it to answer.
      - name: Install from a local registry
        run: |
          npm install --global --silent verdaccio@6
          cd scripts/packages
          verdaccio --config ./verdaccio.yaml --listen 4873 > "$RUNNER_TEMP/verdaccio.log" 2>&1 &
          for _ in $(seq 120); do curl -sf http://localhost:4873/-/ping >/dev/null && break; sleep 1; done
          curl -sf http://localhost:4873/-/ping >/dev/null || { echo "::error::the local registry did not start"; exit 1; }
          token=$(curl -sf -X PUT -H 'content-type: application/json' \
            -d '{"name":"ci","password":"ci-local-only"}' \
            http://localhost:4873/-/user/org.couchdb.user:ci | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          npmrc="$RUNNER_TEMP/npmrc"
          printf 'registry=http://localhost:4873/\n//localhost:4873/:_authToken=%s\n' "$token" > "$npmrc"
          for tgz in "$GITHUB_WORKSPACE"/dist/release/*.tgz; do
            npm publish "$tgz" --userconfig "$npmrc" --registry http://localhost:4873/
          done
          mkdir -p "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project"
          echo '{"name":"project","private":true,"type":"module"}' > package.json
          npm install @brekkylab/virtx --userconfig "$npmrc" --registry http://localhost:4873/
          ls node_modules/@brekkylab

      - name: Install the wheel pip picks
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/bin/python"; [ -x "$py" ] || py="$RUNNER_TEMP/venv/Scripts/python.exe"
          "$py" -m pip install --no-index --find-links dist/release virtx
          "$py" -m pip show virtx
          echo "SMOKE_PYTHON=$py" >> "$GITHUB_ENV"

      - name: Smoke, Node
        run: cd "$RUNNER_TEMP/project" && node "$GITHUB_WORKSPACE/scripts/packages/smoke/node.mjs"

      - name: Smoke, Python
        run: '"$SMOKE_PYTHON" "$GITHUB_WORKSPACE/scripts/packages/smoke/python.py"'

      # The layout a client fetches from, `<base>/v<version>/`, as a release would hang it.
      - name: Smoke, server
        run: |
          releases="$RUNNER_TEMP/releases"
          mkdir -p "$releases/v$VERSION"
          cp dist/release/virtx-stdio-*.tar.gz dist/release/SHA256SUMS "$releases/v$VERSION/"
          "$SMOKE_PYTHON" -m http.server 8765 --bind 127.0.0.1 --directory "$releases" > "$RUNNER_TEMP/http.log" 2>&1 &
          for _ in $(seq 30); do curl -sf "http://127.0.0.1:8765/v$VERSION/SHA256SUMS" >/dev/null && break; sleep 1; done
          VIRTX_DIST_URL=http://127.0.0.1:8765 VIRTX_HOME="$RUNNER_TEMP/virtx-home" \
            "$SMOKE_PYTHON" "$GITHUB_WORKSPACE/scripts/packages/smoke/server.py"

      - name: Logs
        if: failure()
        run: cat "$RUNNER_TEMP/verdaccio.log" "$RUNNER_TEMP/http.log" 2>/dev/null || true
