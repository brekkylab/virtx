[package]
name = "cortex-krun"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# What a user runs: it answers a console session, and what it does with one is to run it
# inside a micro-VM. The VM is not in this process -- a session spawns `cortex-krun-host`, the
# signed binary sitting beside this one, and talks to the guest down a socket that boot turns
# into a console port. See `session::halves` for why the hypervisor is somewhere else and how
# the three files find each other.
[[bin]]
name = "cortex-krun"
path = "src/main.rs"

# Only `examples/run.rs` reads this, and it forwards to the library's own: `session.gpu(true)`
# is a flag a build without a virtio-gpu device ignores, so an example that can ask for one
# needs the feature on the package it lives in. The server itself has no use for it -- it does
# not make a machine, it spawns a boot that does, and whether *that* file can attach a device
# is something it asks the file rather than something this build decides. So it is off, and a
# `cargo build` of this package links no display backend.
[features]
gpu = ["cortex-krun-lib/gpu"]

[build-dependencies]
anyhow = { workspace = true }

[dependencies]
anyhow = { workspace = true }
# The protocol this server answers on stdin and stdout.
cortex = { workspace = true }
# The boot's command line -- its library half, which links no hypervisor.
cortex-krun-host = { workspace = true }
# Putting the image a session names into the cache. The machine itself is the boot's: what
# this binary wants from the library is the store.
cortex-krun-lib = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "time",
] }

# Asking whether the pid a leftover session path is named for is still alive, which each
# platform spells with its own call -- `kill(pid, 0)` on one, `OpenProcess` on the other.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The same release libkrun's own Windows code takes, so one version is resolved rather than
# two compiled.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
