# The four halves of cortex-krun, kept apart because they are built apart.
#
# `cortex-krun-lib` is the whole of the machinery -- images, disks, sessions --
# and links libkrun. `cortex-krun` is what a user runs and what answers a
# console; it holds no hypervisor. `cortex-krun-host` is the process that
# becomes a micro-VM, spawned as a file beside `cortex-krun` rather than
# depended on by it, because on macOS creating a VM needs an entitlement, an
# entitlement is carried by a code signature, and a signature is read at `exec`
# -- so the process that creates a VM can never be the process that decided to.
# `cortex-krun-guest` is the init that runs inside one.
[workspace]
resolver = "3"
members = ["cortex-krun", "cortex-krun-host", "cortex-krun-lib"]

# `3rdparty/libkrun/` is the vendored libkrun submodule, which is its own cargo
# workspace. Without this, cargo would auto-adopt the path dependencies as
# members and collide with that workspace.
#
# `cortex-krun-guest/` is a workspace root of its own: it is cross-compiled to
# `*-unknown-linux-musl`, and a member would be built for the host by a bare
# `cargo build` -- for a target that has no host to run on.
exclude = ["3rdparty/libkrun", "cortex-krun-guest"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# 1.89 for `std::fs::File::lock`, which guards `index.json` against concurrent pulls.
rust-version = "1.89"

[workspace.dependencies]
cortex-krun-lib = { path = "cortex-krun-lib" }

# rutabaga_gfx 0.1.85 on crates.io predates the Darwin sys layer (merged
# 2026-09-02) and routes macOS to a stub backend that panics at runtime.
# Track the repo until a release carries it.
[patch.crates-io]
rutabaga_gfx = { path = "3rdparty/rutabaga_gfx" }
magma-gpu = { path = "3rdparty/rutabaga_gfx/third_party/mesa3d/src/virtio/magma-gpu-rs/lib" }
