# A pull request is linted and tested platform by platform; nothing is published. `main` is
# too, after each merge, and in full: built, packed and tried as a release would be (see
# `pipeline`), and that run is what saves the Rust caches every other ref reads. A run started
# by hand is in full too. The docs are `docs`'s.
name: ci

# Markdown is left out, but for the READMEs the packages ship.
on:
  push:
    branches: [main]
    paths: &paths
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - virtx-py/README.md
      - virtx-node/README.md
  pull_request:
    paths: *paths
  workflow_dispatch:

# A newer push to the pull request makes an older run moot. A run on `main` finishes once
# started, or a merge after a merge would leave no run to save the caches; of the runs waiting
# behind it, only the newest is kept.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pipeline:
    # The checks are named `ci / <job>`.
    name: ci
    uses: ./.github/workflows/pipeline.yml
    with:
      full: ${{ github.event_name != 'pull_request' }}
    # `actions` read, for `tests (windows-x86_64)` to see whether `guest` failed while it waits.
    permissions:
      contents: read
      actions: read
