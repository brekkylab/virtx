[package]
name = "virtx-server-stdio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The server, on `virtx-core`'s protocol over stdio: what a client spawns. Also, as
# `virtx-stdio vm`, the process that becomes a microVM, spawned by itself. The binary is
# named `virtx-stdio`: it is what a release archive carries and what virtx fetches.
[[bin]]
name = "virtx-stdio"
path = "src/main.rs"

[features]
# A virtio-gpu device carrying Vulkan, for a sandbox that asks for one.
gpu = ["virtx-uvm/gpu"]

[dependencies]
# The servers' end of the wire: a request's body read as its args, a job's log as an event
# stream, and stdio served.
http-over-x = { workspace = true, features = ["server"] }
anyhow = { workspace = true }
form_urlencoded = "1"
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# The stdio transport this binary serves the endpoints over, and what they take and answer.
virtx-core = { workspace = true, features = ["server"] }
# What the endpoints answer from, and the machines they start.
virtx-uvm = { workspace = true }
# The endpoints, routed, the router served as the service: the ports endpoints are WebSockets,
# opened over HTTP/2.
axum = { version = "0.8", default-features = false, features = ["http2", "ws"] }
http = "1"
http-body-util = "0.1"
serde = { workspace = true }
serde_json = "1"
# A project store's answer.
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
# The client end, to call the app as a client would, over an in-memory pipe.
virtx-core = { workspace = true, features = ["client", "server", "test-util"] }
# The app served in the test's own process, as over stdio, each request answered as a service.
http-over-x = { workspace = true, features = ["client", "server"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
# An image's config, filed by hand.
serde_json = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
