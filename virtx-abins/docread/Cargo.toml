[package]
name = "virtx-exec-docread"
version.workspace = true
edition.workspace = true
license.workspace = true

# `docread` is what a caller types, and the package name is not it: this is one program, and
# the name it answers to is the one in its usage line and in everything it says about itself.
[[bin]]
name = "docread"
path = "src/main.rs"

# Word documents and PDFs are both read by Rust from end to end, so a build for the guest is
# the same `cargo build` as any other, with nothing to install beyond rustup and the musl
# sysroot `index` already needs. Neither is a feature: a program whose answer to a document
# depended on how it was compiled is one a caller could not read off the binary in front of them.

[dependencies]
# The command line, and the whole of the driving. One command with two options is small enough
# to have been read by hand — but `--help` is what tells a caller that a window has a default
# size at all, and a hand-written usage string is a second place for that number to be wrong.
clap = { workspace = true }

# And nothing else. Deciding whether a file is text is two questions about the bytes of the
# lines being shown — do they decode as UTF-8, is there a NUL among them — which is `std`'s to
# answer. The handful of magic numbers this knows are written out in `text::format_of`, where
# they decide nothing and only put a name to what is being refused; a library of them would be
# a classifier for formats this prints either way it answers.
#
# Nor is there a decoder for other encodings: a window this hands back is text a caller will
# quote line numbers of back at something, and text transcoded out of an encoding nobody
# declared is a guess wearing the clothes of the file.
#
# A document that holds text without being it — a PDF — is a different question, and it is
# `pdf_oxide` below: what a caller gets back is still numbered lines, but lines the engine laid
# out rather than lines somebody wrote, which is a difference the output says out loud rather
# than one a caller has to know.

# Reading Word documents. The model it parses into keeps `w:ins` and `w:del` as what they are
# — tracked insertions and deletions — which is the reason it is this crate and not one of the
# two that answer with plain text in a single call. Both of those drop the text inside `w:ins`:
# in a document under revision that is the *newest* sentence disappearing, silently, from an
# answer that otherwise looks complete. Here the walking is ours, so what counts as the
# document as it stands is a decision written down in `docx.rs` rather than one inherited.
#
# It also parses real files the alternatives choke on, and it writes as well as reads — which
# is what the tests build their fixtures with, so no `.docx` is checked into this repository.
docx-rs = { version = "0.4.22" }

# Deciding whether a file is a Word document, which is a different job from reading one and
# the reason this is here beside `docx-rs`. `read_docx` takes the file's bytes — all of them,
# in memory — so what asks the question cannot be it: every file this program is pointed at
# would then be read whole before the text reader got to say what it holds, and a window onto
# two lines of a gigabyte would cost a gigabyte. A zip carries an index of its entries at its
# end, so `ZipArchive` answers `word/document.xml`, yes or no, out of a seek and a few
# kilobytes however large the archive is.
#
# It costs no dependency: `docx-rs` links this same crate to do its own unpacking, so the
# version here is the one already in the build either way — `deflate-flate2` included, which
# is why asking for it below adds nothing to compile. Asked for all the same: what depends on
# it is ours (`docx::fits` unpacks the archive to find out how large it really is, the entry's
# declared size being a number the file's author wrote), and a dependency that works because
# another crate happens to turn a feature on is one that breaks when that crate stops.
#
# `default-features = false` because the rest is compression methods a `.docx` does not use
# and a writer this only wants in its tests.
zip = { version = "8", default-features = false, features = [
    "deflate-flate2",
] }

# The PDF engine. Pure Rust, so it cross-compiles to the guest with nothing to fetch or build,
# and the program stays one static ELF in `/abin`. Of its default features, `legacy-crypto` is
# kept: it is the MD5 the older standard security handler derives keys with, and plenty of PDFs
# are encrypted with an empty password only to restrict printing. `icc` is colour management,
# which the text layer has no use for.
pdf_oxide = { version = "0.3.78", default-features = false, features = ["legacy-crypto"] }

[dev-dependencies]
tempfile = { workspace = true }
