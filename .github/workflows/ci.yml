# A pull request, and `main` once merged, are built as a release would be, and tested; nothing
# is published. The docs are `docs`'s. `main`'s runs leave the caches every other ref restores.
#
# A push to `cloud` -- virtx's server and client as virtx cloud builds on them -- is checked and
# tested as a pull request is, the suites on the guest parts it builds, but not packed for every
# platform: no server or client builds of each platform, no bundle, no packages smoke-tested.
name: ci

# Markdown is left out, but for the READMEs the packages ship.
on:
  push:
    branches: [main, cloud]
    paths: &paths
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - virtx-py/README.md
      - virtx-node/README.md
  pull_request:
    paths: *paths
  workflow_dispatch:

# A newer push to the pull request, or to `cloud`, makes an older run moot. A run on `main`
# finishes once started; of the runs waiting behind it, only the newest is kept.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/cloud' }}

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    uses: ./.github/workflows/build.yml
    with:
      packages: ${{ github.ref != 'refs/heads/cloud' }}

  test:
    needs: [check, build]
    uses: ./.github/workflows/test.yml
    # `id-token`, for the AWS role `windows-runner` starts the Windows runner with.
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ needs.check.outputs.version }}
      packages: ${{ github.ref != 'refs/heads/cloud' }}
