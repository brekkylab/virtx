# The programs that live in the guest's `/abin`: `index`, `docread` and `display`. They are written and
# built here, for the machine that runs them; `virtx` is what decides what a
# delegated executable *is*.
#
# Its own workspace root rather than a member of the one above: everything here is
# cross-compiled to `*-unknown-linux-musl`, and a member would be built for the host by a bare
# `cargo build` -- for a target that has no host to run on.
[workspace]
resolver = "3"
members = ["display", "docread", "index"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# RFC 3339 timestamps. A row carries when it was last written, and the store is a file other
# tools read: a sortable, unambiguous spelling is worth a dependency.
chrono = "0.4"
# The parser every program here is driven by, and where their `--help` comes from.
clap = { version = "4", features = ["derive"] }
# The store. `bundled` on purpose: the schema is an FTS5 index, and FTS5 is a compile-time
# option the guest's own SQLite is free to have been built without -- a store that opened and
# then answered every search with nothing is the failure being avoided. It compiles SQLite's C,
# which is the one thing here a cross build needs more than rustup for; see
# `.cargo/config.toml`.
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"

# These ship inside an image rather than onto a disk somebody buys, so the binary's size is
# the image's. No `opt-level = "z"` all the same -- unlike the agent, what these do between
# starting and answering is work: an FTS5 query, a `.docx` unpacked, a PDF laid out.
[profile.release]
lto = true
strip = true
