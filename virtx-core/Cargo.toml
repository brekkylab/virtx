[package]
name = "virtx-core"
version = "0.1.2"
edition = "2024"
publish = false

[lib]
# `rlib` for Rust (this crate's tests, and any crate that depends on it); `cdylib` and
# `staticlib` for C, as `libvirtx_core.{so,dylib,dll}` and `libvirtx_core.a`, declared by
# `include/virtx.h`.
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
anyhow = "1"
# HTTP for the Streamable HTTP client: the client rmcp's transport is built on, and the URL
# `init` checks. The same reqwest 0.13 and rustls the `virtx` crate uses.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# The MCP clients: a server process over stdio, or one at a Streamable HTTP endpoint.
rmcp = { version = "3.5", default-features = false, features = [
    "client",
    "reqwest",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
# `protocol`: JSON-RPC 2.0, the client's request bookkeeping and the server's method table,
# under the stdio and Streamable HTTP transports `protocol` adds.
jsonrpsee = { version = "0.26", default-features = false, features = ["async-client", "server"] }
# `protocol::http`'s server: the request and response it handles, and the bodies in them.
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
# `protocol::http`'s session ids.
uuid = { version = "1", features = ["v4"] }
# The schema's types: their wire form, and the JSON Schema a server advertises for them.
schemars = "1"
serde = { version = "1", features = ["derive"] }
# What crosses the C ABI: a call's params and its output, as JSON text.
serde_json = "1"
# A session brings its own runtime, since C calls in without one. `rt-multi-thread` so the
# session's tasks run between C calls, not only inside one.
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
# Writes `include/virtx.h` from `src/ffi.rs`.
cbindgen = { version = "0.29", default-features = false }

[dev-dependencies]
# The fixtures' MCP server, over stdio and Streamable HTTP, and what serves the latter.
rmcp = { version = "3.5", default-features = false, features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
