[package]
name = "virtx-stdio-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The server, on `virtx-core`'s protocol over stdio: what a client spawns. Also, as
# `virtx-uvm vm`, the process that becomes a micro-VM, spawned by itself. The binary keeps
# the name `virtx-uvm`: it is what a release archive carries and what virtx fetches.
[[bin]]
name = "virtx-uvm"
path = "src/main.rs"

[features]
# A virtio-gpu device carrying Vulkan, for a sandbox that asks for one.
gpu = ["virtx-uvm/gpu"]

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# The stdio transport this binary serves the endpoints over, and what they take and answer.
virtx-core = { workspace = true, features = ["server"] }
# What the endpoints answer from, and the machines they start.
virtx-uvm = { workspace = true }
# The endpoints, routed, each request answered by the router as a service.
axum = { version = "0.8", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
http = "1"
http-body-util = "0.1"
serde = { workspace = true }
serde_json = "1"
# A job's log, as an event stream.
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
# The client end, to call the built binary as a client would.
virtx-core = { workspace = true, features = ["client", "server"] }
# An image's config, filed by hand.
serde_json = "1"
# A job's log, read entry by entry.
futures-util = { version = "0.3", default-features = false }
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread"] }
