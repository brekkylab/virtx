# One platform's packages, packed and tried as a user installs them, on the runner the job is
# on: the npm package from a registry on localhost and the wheel pip picks, each opening the
# library it carries; then the server that library fetches, from a release layout served on
# localhost, started and asked to answer.
#
# What the job built is where it built it: the platform's library in `dist/lib/<platform>/`
# and its server's archive in `dist/release/`. Only that platform is packed
# (`--allow-missing`), beside `@brekkylab/virtx` itself, which names every platform's package
# and gets the one this runner is -- the others are not in the registry, and an optional
# dependency that is not there is passed over, as it is on a platform npm does not match.
# A release attaches what each platform packed and tried here, and packs only
# `@brekkylab/virtx` again, once, for all of them; see `release.yml`.
name: packages
description: Pack this platform's npm package and wheel, install them, and smoke them and the server.

inputs:
  version:
    description: The version every manifest says
    required: true
  platform:
    description: The platform's npm name, as `dist/lib/<platform>/` has it (darwin-arm64, ...)
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    # Exactly one platform's: a library missing would pack nothing for it and pass.
    - name: Pack
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        node scripts/packages/pack-npm.mjs dist/lib dist/release --allow-missing
        python -m pip install --quiet build wheel
        scripts/packages/pack-wheels.sh dist/lib dist/release --allow-missing
        cd dist/release
        ls -la
        count() { ls $1 2>/dev/null | wc -l | tr -d ' '; }
        for f in "brekkylab-virtx-$VERSION.tgz" "brekkylab-virtx-$PLATFORM-$VERSION.tgz"; do
          [ -f "$f" ] || { echo "::error::no $f"; exit 1; }
        done
        [ "$(count '*.tgz')" = 2 ] || { echo "::error::not one platform's npm package"; exit 1; }
        [ "$(count '*.whl')" = 1 ] || { echo "::error::not one wheel"; exit 1; }
        [ "$(count 'virtx-stdio-*.tar.gz')" = 1 ] || { echo "::error::not one server archive"; exit 1; }

    # What a client checks the server it fetches against, over this platform's files. Python's,
    # since macOS has no sha256sum.
    - name: SHA256SUMS
      shell: bash
      working-directory: dist/release
      run: |
        python - <<'EOF'
        import hashlib, pathlib
        lines = [f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}"
                 for p in sorted(pathlib.Path(".").iterdir()) if p.is_file() and p.name != "SHA256SUMS"]
        pathlib.Path("SHA256SUMS").write_text("\n".join(lines) + "\n")
        print("\n".join(lines))
        EOF

    # Published with an explicit --registry and a config of its own: the packages'
    # publishConfig names npmjs, and nothing here may reach it. Verdaccio is installed on its
    # own first: on Windows the install alone can outlast the wait for it to answer. It runs
    # from a copy of its config under the job's temp directory, where it keeps its storage and
    # its users: in the checkout they would outlive the job on a runner whose checkout is kept,
    # and the next run's user and versions would already be there.
    - name: Install from a local registry
      shell: bash
      run: |
        npm install --global --silent verdaccio@6
        registry="$RUNNER_TEMP/verdaccio"
        mkdir -p "$registry"
        cp scripts/packages/verdaccio.yaml "$registry/"
        cd "$registry"
        verdaccio --config ./verdaccio.yaml --listen 4873 > "$RUNNER_TEMP/verdaccio.log" 2>&1 &
        for _ in $(seq 120); do curl -sf http://localhost:4873/-/ping >/dev/null && break; sleep 1; done
        curl -sf http://localhost:4873/-/ping >/dev/null || { echo "::error::the local registry did not start"; exit 1; }
        token=$(curl -sf -X PUT -H 'content-type: application/json' \
          -d '{"name":"ci","password":"ci-local-only"}' \
          http://localhost:4873/-/user/org.couchdb.user:ci | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
        npmrc="$RUNNER_TEMP/npmrc"
        printf 'registry=http://localhost:4873/\n//localhost:4873/:_authToken=%s\n' "$token" > "$npmrc"
        for tgz in "$GITHUB_WORKSPACE"/dist/release/*.tgz; do
          npm publish "$tgz" --userconfig "$npmrc" --registry http://localhost:4873/
        done
        mkdir -p "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project"
        echo '{"name":"project","private":true,"type":"module"}' > package.json
        npm install @brekkylab/virtx --userconfig "$npmrc" --registry http://localhost:4873/
        ls node_modules/@brekkylab

    - name: Install the wheel pip picks
      shell: bash
      run: |
        python -m venv "$RUNNER_TEMP/venv"
        py="$RUNNER_TEMP/venv/bin/python"; [ -x "$py" ] || py="$RUNNER_TEMP/venv/Scripts/python.exe"
        "$py" -m pip install --no-index --find-links dist/release virtx
        "$py" -m pip show virtx
        echo "SMOKE_PYTHON=$py" >> "$GITHUB_ENV"

    - name: Smoke, Node
      shell: bash
      run: cd "$RUNNER_TEMP/project" && node "$GITHUB_WORKSPACE/scripts/packages/smoke/node.mjs"

    - name: Smoke, Python
      shell: bash
      run: '"$SMOKE_PYTHON" "$GITHUB_WORKSPACE/scripts/packages/smoke/python.py"'

    # The layout a client fetches from, `<base>/v<version>/`, as a release would hang it.
    - name: Smoke, server
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        releases="$RUNNER_TEMP/releases"
        mkdir -p "$releases/v$VERSION"
        cp dist/release/virtx-stdio-*.tar.gz dist/release/SHA256SUMS "$releases/v$VERSION/"
        "$SMOKE_PYTHON" -m http.server 8765 --bind 127.0.0.1 --directory "$releases" > "$RUNNER_TEMP/http.log" 2>&1 &
        for _ in $(seq 30); do curl -sf "http://127.0.0.1:8765/v$VERSION/SHA256SUMS" >/dev/null && break; sleep 1; done
        VIRTX_DIST_URL=http://127.0.0.1:8765 VIRTX_HOME="$RUNNER_TEMP/virtx-home" \
          "$SMOKE_PYTHON" "$GITHUB_WORKSPACE/scripts/packages/smoke/server.py"

    - name: Logs
      if: failure()
      shell: bash
      run: cat "$RUNNER_TEMP/verdaccio.log" "$RUNNER_TEMP/http.log" 2>/dev/null || true
