# A pull request is built and tested platform by platform, as a release would be; nothing is
# published. `main` is too, after each merge: that run is what saves the Rust caches every
# other ref reads (see `pipeline`). The docs are `docs`'s.
name: ci

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - docs/**
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - docs/**
  workflow_dispatch:

# A newer push to the pull request makes an older run moot. `main`'s runs are not cut short:
# a merge after a merge would otherwise leave no run to save the caches.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/pipeline.yml
    # `id-token`, for the AWS role `windows-runner` starts the Windows runner with.
    permissions:
      contents: read
      id-token: write
