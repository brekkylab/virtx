# virglrenderer as 3rdparty/_scripts/build-virglrenderer.* installs it under build/ for the servers'
# `gpu` feature -- on Windows with an import library for Vulkan's loader -- kept by runs-on/cache
# by what it is built from: its script, its submodule and its patches, and on macOS the same of
# the MoltenVK it links. The script builds it again only when its stamp says it was built from
# something else, so a cache of another tree's or another runner's only costs its download.
# Building it took a minute of each Windows job that does, and 11 to 14 seconds on Linux.
# MoltenVK itself, macOS's, keeps its own cache in the job.
name: gpu-deps
description: virglrenderer as its build script installs it under build/, restored and saved by what it is built from

runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: |
        case "$RUNNER_OS" in
          Windows) scripts=3rdparty/_scripts/build-virglrenderer.ps1; submodules=virglrenderer ;;
          macOS) scripts="3rdparty/_scripts/build-virglrenderer.sh 3rdparty/_scripts/build-moltenvk.sh"; submodules="virglrenderer MoltenVK SPIRV-Cross" ;;
          *) scripts=3rdparty/_scripts/build-virglrenderer.sh; submodules=virglrenderer ;;
        esac
        from=$({ git hash-object $scripts; for s in $submodules; do git rev-parse "HEAD:3rdparty/$s" "HEAD:3rdparty/_patches/$s"; done; } | git hash-object --stdin)
        echo "key=gpu-deps-$RUNNER_OS-$RUNNER_ARCH-$from" >> "$GITHUB_OUTPUT"

    - uses: runs-on/cache@3c223729b4fda74ee12f4976048dd69b420fdd26 # v5
      with:
        path: |
          build/virglrenderer
          build/vulkan
          build/pkgconfig
        key: ${{ steps.key.outputs.key }}
