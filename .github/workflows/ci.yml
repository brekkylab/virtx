# A pull request, and `main` once merged, are built as a release would be, and tested; nothing
# is published. The docs are `docs`'s. `main`'s runs leave the caches every other ref restores.
name: ci

# Markdown is left out, but for the READMEs the packages ship.
on:
  push:
    branches: [main]
    paths: &paths
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - virtx-py/README.md
      - virtx-node/README.md
  pull_request:
    paths: *paths
  workflow_dispatch:

# A newer push to the pull request makes an older run moot. A run on `main` finishes once
# started; of the runs waiting behind it, only the newest is kept.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    uses: ./.github/workflows/build.yml

  test:
    needs: [check, build]
    uses: ./.github/workflows/test.yml
    # `id-token`, for the AWS role `windows-runner` starts the Windows runner with.
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ needs.check.outputs.version }}
