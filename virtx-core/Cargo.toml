[package]
name = "virtx-core"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
# `rlib` for Rust (this crate's tests, and any crate that depends on it); `cdylib` and
# `staticlib` for C, as `libvirtx_core.{so,dylib,dll}` and `libvirtx_core.a`, declared by
# `include/virtx.h`.
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
# What the types need, and all they need: a crate that only names requests and their answers
# (`virtx`, the Rust client in `virtx-rs/`, which reaches the library through the C ABI) takes `default-features = false`.
anyhow = "1"
serde = { version = "1", features = ["derive"] }

# HTTP over TCP for the client. The same reqwest 0.13 and rustls the `virtx` crate uses.
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
# HTTP/2 over stdio for both ends, and the server's end of either transport.
hyper = { version = "1", optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
# The requests and responses both transports carry, and a method's `Extensions`.
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
# Every body is JSON; a job's log is a `text/event-stream`, read and written as SSE.
serde_json = { version = "1", optional = true }
sse-stream = { version = "0.2", optional = true }
# `Stream`, which a job's log is, and the macro that writes one.
futures-util = { version = "0.3", default-features = false, features = ["alloc"], optional = true }
async-stream = { version = "0.3", optional = true }
# The framing of a port's WebSocket, whose handshake the HTTP client sends: no TLS or
# connecting of its own.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"], optional = true }
# The files endpoint is WebDAV: a `PROPFIND` answers XML, its dates are HTTP dates, and each
# segment of a path is percent-encoded.
roxmltree = { version = "0.21", optional = true }
httpdate = { version = "1", optional = true }
percent-encoding = { version = "2", optional = true }
# The test server: every endpoint but the registry, in memory, mounted in axum, which the stdio
# tests serve as the hyper service `TowerToHyperService` makes of it.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"], optional = true }
dav-server = { version = "0.11", default-features = false, features = ["memfs", "hyper"], optional = true }
# A session brings its own runtime, since C calls in without one. `rt-multi-thread` so the
# session's tasks run between C calls, not only inside one.
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"], optional = true }
# An image downloaded or uploaded is an OCI image layout in a tar archive, each blob's digest
# checked as it is read.
tar = { version = "0.4", default-features = false, optional = true }
sha2 = { version = "0.10", optional = true }
# The server's release archive, fetched when this host has none, is a tar.gz, checked against
# the release's SHA256SUMS.
flate2 = { version = "1", optional = true }
# The `virtx` command's arguments.
clap = { version = "4", features = ["derive", "env"], optional = true }

[target.'cfg(unix)'.dependencies]
# `signal(SIGPIPE, SIG_DFL)`, so `virtx images | head` ends quietly.
libc = { version = "0.2", optional = true }

[build-dependencies]
# Writes `include/virtx.h` from `src/ffi.rs`.
cbindgen = { version = "0.29", default-features = false }

[dev-dependencies]
# The types' tests read their wire form back.
serde_json = "1"
# What serves the HTTP tests' server, and the tests' own requests to it.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# Names no two of the registry tests' uploads and files alike.
uuid = { version = "1", features = ["v4"] }
# The stdio tests' server reads its own stdin and writes its own stdout.
tokio = { version = "1", features = ["io-std"] }
# The crate's own tests take the test server, so a bare `cargo test` runs them all. A dev
# dependency's features reach no build but the tests'.
virtx-core = { path = ".", features = ["testing"] }

[features]
# The types (`image`, `volume`, the methods' args and outputs) are always built. `client` adds
# the wire's client end, `server` its server end, and `ffi` the C ABI over a client, which is
# what `libvirtx_core` is built for. `testing` adds the test server over both, which the
# crate's tests, and the bindings' tests through the `test_server` example, run against: a
# bare `cargo test` turns it on for them. `cli` adds the `virtx` command, which the bindings run
# through `virtx_cli_main`.
default = ["ffi", "cli"]
client = [
    "dep:reqwest",
    "dep:hyper",
    "hyper/client",
    "hyper/http2",
    "dep:hyper-util",
    "dep:bytes",
    "dep:http",
    "dep:http-body-util",
    "dep:serde_json",
    "dep:sse-stream",
    "dep:futures-util",
    "dep:async-stream",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:tar",
    "dep:flate2",
    "dep:sha2",
    "dep:roxmltree",
    "dep:httpdate",
    "dep:percent-encoding",
]
server = [
    "dep:hyper",
    "hyper/server",
    "hyper/http2",
    "dep:hyper-util",
    "dep:bytes",
    "dep:http",
    "dep:http-body",
    "dep:tokio",
    "dep:serde_json",
    "dep:futures-util",
]
ffi = ["client"]
cli = ["client", "dep:clap", "dep:libc", "tokio/signal"]
testing = [
    "client",
    "server",
    "dep:axum",
    "dep:dav-server",
    "hyper-util/service",
]

# Runs a child process of itself as the server, so libtest's output stays off its stdout.
[[test]]
name = "stdio"
harness = false
required-features = ["testing"]

# Scenarios across a real transport, against the test server as a child process of itself or a
# server the environment names: `cargo xtask test` names the servers it built and signed.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
harness = false
required-features = ["testing"]

# The test server over stdio, which the bindings' tests spawn.
[[example]]
name = "test_server"
required-features = ["testing"]
