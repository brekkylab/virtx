[target.aarch64-apple-darwin]
# The boot half is signed as it is linked -- see the script. Nothing else about
# the link is this repository's.
linker = "scripts/macos-link.sh"
runner = "scripts/macos-run.sh"

[target.x86_64-pc-windows-msvc]
runner = "scripts/windows-run.cmd"

[env]
# virglrenderer built by scripts/build-virglrenderer.sh, needed by the `gpu`
# feature. Not forced, so an existing PKG_CONFIG_PATH in the environment wins.
PKG_CONFIG_PATH = { value = "build/virglrenderer/lib/pkgconfig", relative = true }
