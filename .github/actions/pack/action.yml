# The one place the client's packages are built: the wheel (setuptools-rust), the platform's npm
# package (napi) and `@brekkylab/virtx`. On Linux it runs in the manylinux image, with its Python.
name: pack
description: Build this platform's wheel and npm package, and @brekkylab/virtx, into a directory.

inputs:
  platform:
    description: The platform's npm name (darwin-arm64, linux-x64-gnu, ...)
    required: true
  target:
    description: The Rust target triple the library is built for
    required: true
  out:
    description: The directory the wheel and the package's tarball go into
    required: true

runs:
  using: composite
  steps:
    # npm 11: npm 10 runs `prepare` despite --ignore-scripts.
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: 24

    - if: runner.os != 'Linux'
      uses: actions/setup-python@v7.1.0
      with:
        python-version: "3.12"

    - name: Wheel
      shell: bash
      env:
        CARGO_BUILD_TARGET: ${{ inputs.target }}
        OUT: ${{ inputs.out }}
      run: |
        mkdir -p "$OUT"
        python -m pip install --quiet build~=1.6
        # Tagged here, not by auditwheel: `pipeline` checks the library links glibc alone.
        plat=()
        if [ "$RUNNER_OS" = Linux ]; then
          plat=("-C--build-option=--plat-name=manylinux_2_28_$(uname -m)")
        fi
        python -m build --wheel "${plat[@]}" --outdir "$OUT" virtx-py

    - name: npm package
      shell: bash
      working-directory: virtx-node
      env:
        PLATFORM: ${{ inputs.platform }}
        TARGET: ${{ inputs.target }}
        OUT: ${{ inputs.out }}
      run: |
        npm ci --ignore-scripts --no-audit --no-fund
        npx napi create-npm-dirs
        npx napi build --platform --release --no-js --target "$TARGET" \
          --manifest-path ../virtx-cabi/Cargo.toml --output-dir "npm/$PLATFORM"
        npm pack "./npm/$PLATFORM" --pack-destination "$GITHUB_WORKSPACE/$OUT"

    # npm packs only what is in `virtx-node/`.
    - name: "@brekkylab/virtx"
      shell: bash
      env:
        OUT: ${{ inputs.out }}
      run: |
        cp README.md LICENSE virtx-node/
        (cd virtx-node && npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/$OUT")
