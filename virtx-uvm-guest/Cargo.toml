[package]
name = "virtx-uvm-guest"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# The init inside each of virtx-uvm's machines. Its own workspace root: it is cross-compiled to
# `*-unknown-linux-musl`, and a member would be built for the host by a bare `cargo build`.
#
# It builds no root: libkrun's init mounts the image under the machine's ext4, pivots onto the
# overlay, mounts the shares and only then execs this binary. What is left is the channel and
# the commands run over it.
[workspace]

[[bin]]
name = "virtx-uvm-guest"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Process groups, the signal a timeout is, and `sync(2)`.
libc = "0.2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
# The channel's frames; the channel itself is `virtx-uvm/src/machine/wire.rs`, included by
# path.
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
