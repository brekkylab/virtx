# Everything a release carries, built from the ref the caller runs on: the stdio server and the
# client's packages, for every platform. `ci` and `release` call it, and take what it built
# from the run's `bundle` artifact, `dist/release/`:
#
#   virtx-stdio-<os>-<arch>.tar.gz   the server, the guest kernel and abin
#   brekkylab-virtx-*.tgz            the npm packages
#   virtx-*.whl                      the wheels
#   SHA256SUMS                       over all of them
#
# Jobs hand on as artifacts of the run, which a called workflow shares with its caller, and
# a rerun uploads over. They are kept a day, the least allowed: long enough to rerun a job.
#
# # Platforms
#
# | server         | client          | runner                              |
# |----------------|-----------------|-------------------------------------|
# | macos-aarch64  | darwin-arm64    | macos-15                            |
# | linux-x86_64   | linux-x64-gnu   | ubuntu-24.04, in manylinux_2_28     |
# | linux-aarch64  | linux-arm64-gnu | ubuntu-24.04-arm, in manylinux_2_28 |
# | windows-x86_64 | win32-x64-msvc  | windows-2025                        |
#
# The guest kernel is built in a Linux container (xtask/scripts/build-libkrunfw.sh), which
# neither macOS runners (no Docker) nor Windows runners (Windows containers) can run, so the
# two `guest-parts` jobs build every platform's kernel. abin goes the same way: it is the
# guest's, so it depends on the architecture only, and its C is cross-compiled by a shell
# script Windows cannot run.
#
# # The glibc floor
#
# What is built for Linux runs on glibc 2.28 and later (RHEL 8, Debian 10, Ubuntu 20.04): it is
# built in a manylinux_2_28 container, because a binary needs the glibc of the headers it was
# compiled against. It links that glibc and nothing else a distribution ships at its own
# version: no OpenSSL (rustls on Linux), no libdrm, and Vulkan only opened at run time. Each
# Linux build checks it.
name: build

on:
  workflow_call:
    outputs:
      version:
        description: The version every manifest says
        value: ${{ jobs.resolve.outputs.version }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The version the manifests say, which all of them say alike, and which a tag names. Every
  # build waits for it, so a tag the manifests do not match builds nothing.
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: resolve
        name: Every manifest is one version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          toml() { sed -n 's/^version = "\(.*\)"$/\1/p' "$1" | head -1; }
          version=$(jq -r .version virtx-node/package.json)
          wrong=""
          for f in virtx-core/Cargo.toml virtx-rs/Cargo.toml virtx-py/pyproject.toml; do
            [ "$(toml "$f")" = "$version" ] || wrong="$wrong $f=$(toml "$f")"
          done
          [ -z "$wrong" ] || { echo "::error::virtx-node/package.json says $version, but:$wrong"; exit 1; }
          if [ "$REF_TYPE" = tag ] && [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG, but the manifests say $version"; exit 1
          fi
          echo "virtx $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The guest kernel for every platform of the architecture, and abin.
  guest-parts:
    name: guest parts (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            targets: linux windows
          - arch: aarch64
            runner: ubuntu-24.04-arm
            targets: linux macos
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # A kernel is only its tag, its config and this script, which pins both.
      - uses: actions/cache@v6
        id: cache
        with:
          path: build/krunfw
          key: kernel-${{ matrix.arch }}-${{ matrix.targets }}-${{ hashFiles('xtask/scripts/build-libkrunfw.sh') }}

      - name: Kernel
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          for target in ${{ matrix.targets }}; do
            echo "::group::libkrunfw for $target"
            LIBKRUNFW_TARGET=$target sh xtask/scripts/build-libkrunfw.sh
            echo "::endgroup::"
          done

      - run: ls -la build/krunfw

      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.arch }}-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: abin-${{ matrix.arch }}

      - name: abin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm
          cargo xtask build abin
          ls -la target/release/abin

      # As a tar: an artifact keeps no file modes, and abin must stay executable.
      - name: Hand the kernel and abin on
        run: |
          mkdir -p handoff/kernel
          cp -v build/krunfw/* handoff/kernel/
          cp -R target/release/abin handoff/abin
          tar -cf handoff.tar handoff

      - uses: actions/upload-artifact@v7
        with:
          name: guest-${{ matrix.arch }}
          path: handoff.tar
          overwrite: true
          retention-days: 1

  # `virtx-stdio`, archived with the kernel and abin.
  server:
    name: server (${{ matrix.release }})
    needs: guest-parts
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: macos-aarch64
            runner: macos-15
            arch: aarch64
          - release: linux-x86_64
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            arch: x86_64
          - release: linux-aarch64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            arch: aarch64
          - release: windows-x86_64
            runner: windows-2025
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      # Before any checkout: Windows' git converts to CRLF, and the GPU libraries' builds run
      # shell scripts written against LF.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          submodules: true

      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.arch }}-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          # Apart from builds on the runner itself, whose newer glibc C would carry into this one.
          key: server-${{ matrix.release }}${{ matrix.container && '-manylinux_2_28' || '' }}

      # AlmaLinux's packages and the image's own Python, for meson and virglrenderer's
      # generators. The image sets PKG_CONFIG_PATH, which `.cargo/config.toml`'s [env] does not
      # override, so virglrenderer's goes in front of it here. zstd: the cache compresses with it.
      - name: Toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          dnf -y -q install clang clang-devel llvm lld vulkan-headers vulkan-loader-devel zstd
          py=/opt/python/cp312-cp312/bin
          "$py/pip" install -q --root-user-action=ignore meson ninja pyyaml mako
          echo "$py" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$PWD/build/virglrenderer/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install lld llvm meson ninja

      # pkg-config.exe for build-deps.ps1, which PowerShell runs (Git Bash's is not an .exe),
      # and libclang for bindgen.
      - name: Toolchain (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y --no-progress pkgconfiglite
          where.exe pkg-config.exe
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      - name: Add the guest's musl target
        run: cargo xtask init

      # MoltenVK takes most of a macOS build, and changes only with its submodule.
      - name: MoltenVK cache
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: 3rdparty/MoltenVK/Package
          key: moltenvk-${{ hashFiles('.git/modules/MoltenVK/HEAD', 'xtask/scripts/build-deps.sh') }}

      - uses: actions/download-artifact@v8
        with:
          name: guest-${{ matrix.arch }}

      # macOS links the kernel.c the Linux job built; the others take the library as it is.
      - name: Put the kernel and abin in place
        run: |
          tar -xf handoff.tar
          mkdir -p build/krunfw target/release
          case "${{ matrix.release }}" in
            macos-*)   LIBKRUNFW_KERNEL_C="$PWD/handoff/kernel/kernel.c" cargo xtask build kernel ;;
            linux-*)   cp -v handoff/kernel/libkrunfw.so.* build/krunfw/ ;;
            windows-*) cp -v handoff/kernel/libkrunfw.dll build/krunfw/ ;;
          esac
          cp -R handoff/abin target/release/
          ls -la build/krunfw target/release/abin

      - name: Build
        run: cargo xtask build server-stdio --locked

      - name: virglrenderer's log (Windows, on failure)
        if: failure() && runner.os == 'Windows'
        run: |
          log=build/virglrenderer-build.log
          [ -f "$log" ] || { echo "no $log"; exit 0; }
          # Windows PowerShell writes a redirect as UTF-16.
          iconv -f UTF-16 -t UTF-8 "$log" > "$log.txt" 2>/dev/null || tr -d '\000' < "$log" > "$log.txt"
          grep -nE -B3 -A6 "^FAILED|error( [A-Z]+[0-9]+)?:" "$log.txt" | head -100
          tail -30 build/virglrenderer-build/meson-logs/meson-log.txt 2>/dev/null || true

      # `__isoc23_*` is glibc 2.38's and comes in unversioned, so the version alone would not show it.
      - name: The glibc floor (Linux)
        if: runner.os == 'Linux'
        run: |
          f=target/release/virtx-stdio
          syms=$(objdump -T "$f")
          need=$(grep -oE 'GLIBC_2\.[0-9]+' <<<"$syms" | sort -t. -k2 -n -u | tail -1)
          libs=$(objdump -p "$f" | awk '/NEEDED/{print $2}' | tr '\n' ' ')
          echo "$f needs $need; links $libs"
          [ "${need#GLIBC_2.}" -le 28 ] || { echo "::error::$f needs $need, above glibc 2.28"; fail=1; }
          if grep -q __isoc23_ <<<"$syms"; then echo "::error::$f references __isoc23_*"; fail=1; fi
          if printf '%s' "$libs" | grep -qE 'libssl|libcrypto'; then echo "::error::$f links OpenSSL"; fail=1; fi
          exit ${fail:-0}

      # Nothing Windows may lack is loaded at start-up: the C++ runtime is linked in and the rest
      # delay-loaded, so a host without them runs virtx-stdio far enough to say what to install.
      - name: DLL imports (Windows)
        if: runner.os == 'Windows'
        run: |
          f=target/release/virtx-stdio.exe
          "/c/Program Files/LLVM/bin/llvm-readobj.exe" --coff-imports "$f" \
            | awk '/^Import \{/{k="load"} /^DelayImport \{/{k="delay"} /Name: .*\.dll/{print "  " k ": " $2}' \
            | sort -u | tee "$RUNNER_TEMP/imports.txt"
          if grep -iE "load: (vcruntime|msvcp|vulkan-1|winhv)" "$RUNNER_TEMP/imports.txt"; then
            echo "::error::$f needs the DLLs above to start"; exit 1
          fi

      - name: Archive
        run: cargo xtask archive --with-abin

      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.release }}
          path: target/release/dist/virtx-stdio-${{ matrix.release }}.tar.gz
          overwrite: true
          retention-days: 1

  # `libvirtx_core`, which every package of the platform carries.
  client:
    name: client (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            file: libvirtx_core.dylib
          - platform: linux-x64-gnu
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            target: x86_64-unknown-linux-gnu
            file: libvirtx_core.so
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            target: aarch64-unknown-linux-gnu
            file: libvirtx_core.so
          - platform: win32-x64-msvc
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            file: virtx_core.dll
    needs: resolve
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # The oldest macOS the wheel's tag says it runs on.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7

      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: client-${{ matrix.target }}${{ matrix.container && '-manylinux_2_28' || '' }}

      - name: zstd, for the cache (Linux)
        if: runner.os == 'Linux'
        run: dnf -y -q install zstd

      - name: libvirtx_core
        run: |
          cargo xtask build client --locked --target ${{ matrix.target }}
          mkdir -p dist/lib/${{ matrix.platform }}
          cp target/${{ matrix.target }}/release/${{ matrix.file }} dist/lib/${{ matrix.platform }}/
          ls -la dist/lib/${{ matrix.platform }}

      - name: The glibc floor (Linux)
        if: runner.os == 'Linux'
        run: |
          f=dist/lib/${{ matrix.platform }}/${{ matrix.file }}
          syms=$(objdump -T "$f")
          need=$(grep -oE 'GLIBC_2\.[0-9]+' <<<"$syms" | sort -t. -k2 -n -u | tail -1)
          echo "$f needs $need"
          [ "${need#GLIBC_2.}" -le 28 ] || { echo "::error::$f needs $need, above glibc 2.28"; fail=1; }
          if grep -q __isoc23_ <<<"$syms"; then echo "::error::$f references __isoc23_*"; fail=1; fi
          exit ${fail:-0}

      # No DLL Windows does not ship: the C runtime is linked in (`.cargo/config.toml`).
      - name: DLL imports (Windows)
        if: runner.os == 'Windows'
        run: |
          f=dist/lib/${{ matrix.platform }}/${{ matrix.file }}
          "/c/Program Files/LLVM/bin/llvm-readobj.exe" --coff-imports "$f" \
            | awk '/^Import \{/{k="load"} /^DelayImport \{/{k="delay"} /Name: .*\.dll/{print "  " k ": " $2}' \
            | sort -u | tee "$RUNNER_TEMP/imports.txt"
          if grep -iE "load: (vcruntime|msvcp)" "$RUNNER_TEMP/imports.txt"; then
            echo "::error::$f needs the DLLs above to load"; exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: client-${{ matrix.platform }}
          path: dist/lib/${{ matrix.platform }}/${{ matrix.file }}
          overwrite: true
          retention-days: 1

  # Every platform's server and library, packed into what a release carries. Nothing here
  # compiles, so it all happens on one runner.
  bundle:
    needs: [resolve, server, client]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          pattern: server-*
          merge-multiple: true
          path: target/release/dist

      - uses: actions/download-artifact@v8
        with:
          name: client-darwin-arm64
          path: dist/lib/darwin-arm64
      - uses: actions/download-artifact@v8
        with:
          name: client-linux-x64-gnu
          path: dist/lib/linux-x64-gnu
      - uses: actions/download-artifact@v8
        with:
          name: client-linux-arm64-gnu
          path: dist/lib/linux-arm64-gnu
      - uses: actions/download-artifact@v8
        with:
          name: client-win32-x64-msvc
          path: dist/lib/win32-x64-msvc

      - name: Server archives
        run: |
          mkdir -p dist/release
          mv target/release/dist/virtx-stdio-*.tar.gz dist/release/

      - name: npm packages
        run: |
          node scripts/packages/pack-npm.mjs dist/lib dist/release
          tar -xzOf dist/release/brekkylab-virtx-${{ needs.resolve.outputs.version }}.tgz package/package.json

      - name: Wheels
        run: |
          python -m pip install --quiet build wheel
          scripts/packages/pack-wheels.sh dist/lib dist/release
          pipx run twine check --strict dist/release/*.whl

      - name: SHA256SUMS
        working-directory: dist/release
        run: |
          sha256sum -- * | tee SHA256SUMS
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: dist/release
          overwrite: true
          retention-days: 1
