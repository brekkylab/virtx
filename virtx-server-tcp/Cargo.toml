[package]
name = "virtx-server-tcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# The stdio server's: this binary links libkrun and becomes a machine just the same.
build = "../virtx-server-stdio/build.rs"

# The server, on `virtx-core`'s protocol over HTTP, to the users and projects its config names;
# and the library it is built from, which a server with tenants and routes of its own builds on.
[features]
gpu = ["virtx-uvm/gpu"]

[dependencies]
# The servers' end of the wire: a request's body read as its args, a job's log as an event
# stream, and stdio served.
http-over-x = { workspace = true, features = ["server"] }
anyhow = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "ws"] }
clap = { version = "4", features = ["derive"] }
form_urlencoded = "1"
http = "1"
http-body-util = "0.1"
# An OpenID Connect provider's tokens, checked against its keys.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
# The provider's discovery document and keys. Its TLS is the one `virtx-uvm` picks for the host.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { workspace = true }
serde_json = "1"
# A project store's answer, which one over a database awaits; and a home's sandboxes parked
# side by side.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
thiserror = "2"
# A member's user, as a segment of the path its `Location` names.
percent-encoding = "2"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# What a browser at one of the config's origins may ask: the preflights of the WebDAV methods.
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
# A token's randomness.
uuid = { version = "1", features = ["v4"] }
# What the endpoints take and answer.
virtx-core = { workspace = true, features = ["server"] }
# What the endpoints answer from, and the machines they start.
virtx-uvm = { workspace = true }

[dev-dependencies]
# Tokens signed as an issuer signs them.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
# A blob's digest, as a registry's client computes it.
sha2 = "0.10"
# A test's own root, removed when it is done.
tempfile = "3"
# A request sent to a router as the server would.
tower = { version = "0.5", default-features = false, features = ["util"] }
# The wire, spoken by hand, and by virtx-core's client with the project given at connect.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
virtx-core = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["io-util", "process"] }
# A port's WebSocket, as a client would open it.
tokio-tungstenite = "0.29"

# Ctrl-break sent to a server, as an operator interrupts it on Windows.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_System_Threading"] }
