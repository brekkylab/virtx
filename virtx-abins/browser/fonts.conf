<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The fonts `browser` installs beside this file, which the browser it runs finds through
     FONTCONFIG_FILE. The cache goes where the guest's user keeps one, since /abin is read-only. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family><family>DejaVu Sans</family><family>Noto Sans CJK KR</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Liberation Serif</family><family>DejaVu Serif</family><family>Noto Sans CJK KR</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Liberation Mono</family><family>Noto Sans Mono CJK KR</family></prefer>
  </alias>
</fontconfig>
