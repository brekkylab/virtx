# The halves of virtx-uvm, kept apart because they are built apart.
#
# `virtx-uvm-lib` is the whole of the machinery -- images, disks, machines --
# and links libkrun. `virtx-uvm` is the one binary: what a user runs, what
# answers a console, and -- as `virtx-uvm boot`, spawned by itself -- the
# process that becomes a micro-VM. `virtx-uvm-guest` is the init that runs
# inside one, cross-compiled for the guest and so built apart.
[workspace]
resolver = "3"
members = ["virtx-uvm", "virtx-uvm-lib", "xtask"]

# `3rdparty/libkrun/` is the vendored libkrun submodule, which is its own cargo
# workspace. Without this, cargo would auto-adopt the path dependencies as
# members and collide with that workspace.
#
# `virtx-uvm-guest/` and `virtx-abins/` are workspace roots of their own: both are
# cross-compiled to `*-unknown-linux-musl`, and a member would be built for the host
# by a bare `cargo build` -- for a target that has no host to run on. Listed here and
# not merely left out of `members`: a package under this directory that is neither
# resolves against this root, and the ones in `virtx-abins/` inherit dependencies
# this workspace has no reason to declare.
#
# `virglrenderer-sys/` builds virglrenderer with meson, and is reached only through
# rutabaga_gfx under the `gpu` feature. As a member a bare `cargo build` would run it.
exclude = ["3rdparty/libkrun", "virtx-uvm-guest", "virtx-abins", "virglrenderer-sys"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# 1.89 for `std::fs::File::lock`, which guards `index.json` against concurrent pulls.
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
# The console protocol the server answers and the guest speaks: the frames, the calls and
# the codes a refusal carries. A path to the sibling checkout, because the two repositories
# are developed together -- `virtx` is what decides what a session *is*, and this one is one
# backend for it.
#
# No default features: what is wanted is the console, and every binding virtx offers brings
# a libfuse provider or an HTTP stack with it. That includes the default `ensure`, which
# fetches a published virtx-uvm -- this server has no use for fetching itself.
virtx = { path = "../virtx", default-features = false }
virtx-uvm-lib = { path = "virtx-uvm-lib" }
# The wire's codec, which `virtx` already carries in its public API: two versions of it in
# one build would be a type error nobody could read.
bson = { version = "3", features = ["serde"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
tokio = "1"

# rutabaga_gfx 0.1.85 on crates.io predates the Darwin sys layer (merged
# 2026-09-02) and routes macOS to a stub backend that panics at runtime.
# Track the repo until a release carries it.
[patch.crates-io]
# arcbox-ext4 0.1.2's `FileTree::lookup` compares a path component against "/",
# which `Component::RootDir` never spells on Windows -- so formatting a session's
# ext4 answered `NotFound("/")` there. Patched in the submodule; the commit is the
# one 0.1.2 was published from.
arcbox-ext4 = { path = "3rdparty/arcbox-ext4" }
rutabaga_gfx = { path = "3rdparty/rutabaga_gfx" }
magma-gpu = { path = "3rdparty/rutabaga_gfx/third_party/mesa3d/src/virtio/magma-gpu-rs/lib" }

