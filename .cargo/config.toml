[env]
# virglrenderer built by xtask/scripts/build-deps.sh, needed by the `gpu`
# feature. Not forced, so an existing PKG_CONFIG_PATH in the environment wins.
PKG_CONFIG_PATH = { value = "build/virglrenderer/lib/pkgconfig", relative = true }

[alias]
xtask = "run --package xtask --"

# The guest kernel is `dlopen`ed by leaf name and lives beside the binary that opens it
# -- see `virtx-uvm-lib/build.rs`. Windows' loader looks in the executable's own
# directory before anywhere else, and macOS is steered there by a patch to libkrun, but
# on Linux what decides is the *calling object's* `DT_RUNPATH`, which is the binary's and
# so is the link's to set. `$ORIGIN` is how that names the directory the binary is in,
# and it is the linker that expands it, not a shell. Only the gnu targets: the guest and
# abin are static musl binaries linked by rust-lld directly, which open no kernel and
# take no `-Wl,`.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))']
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN"]

# The C runtime linked in, on Windows: the default imports it from `VCRUNTIME140.dll`, which
# is the Visual C++ Redistributable's and not Windows' own, so a release would have to ship
# it or its installer. Static, a release is its files and nothing else. The C libraries
# linked with it have to agree -- `cc-rs` follows this flag by itself, and
# `xtask/scripts/build-deps.ps1` builds libepoxy and virglrenderer with `b_vscrt=mt` to match.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
