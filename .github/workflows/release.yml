# A version tag, `v<version>` of what every manifest says, is built, tested, and everything it
# built attached to the tag's GitHub release as a draft. Publishing the draft is a person's
# step, and runs `publish`.
#
# Attached to a draft only: a draft's assets are seen by the repository's writers alone, so a
# release is never public with some of its files, and a published one is never changed. A
# rerun replaces the draft's assets; a tag whose release is published fails here.
#
# A tag with a pre-release suffix (`v1.2.0-rc.1`) makes a pre-release, which is public once
# published, the way to try the whole path before the version itself.
name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/pipeline.yml
    with:
      release: true
    # `id-token`, for the AWS role `windows-runner` starts the Windows runner with.
    permissions:
      contents: read
      id-token: write

  # What each platform packed and tried, and `@brekkylab/virtx`, packed once here for all of
  # them: it names every platform's package and carries no library of its own. Every
  # platform's files are counted in, so a platform that handed nothing on fails here rather
  # than leaving the release without it.
  draft:
    needs: pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.pipeline.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: "@brekkylab/virtx"
        run: |
          mkdir -p "$RUNNER_TEMP/no-libs"
          node scripts/packages/pack-npm.mjs "$RUNNER_TEMP/no-libs" dist/release --allow-missing
          tar -xzOf "dist/release/brekkylab-virtx-$VERSION.tgz" package/package.json

      - name: Every platform's files
        working-directory: dist/release
        run: |
          for platform in darwin-arm64 linux-x64-gnu linux-arm64-gnu win32-x64-msvc; do
            [ -f "brekkylab-virtx-$platform-$VERSION.tgz" ] || { echo "::error::no $platform npm package"; fail=1; }
          done
          for release in macos-aarch64 linux-x86_64 linux-aarch64 windows-x86_64; do
            [ -f "virtx-stdio-$release.tar.gz" ] || { echo "::error::no $release server"; fail=1; }
          done
          [ "$(ls *.whl | wc -l)" = 4 ] || { echo "::error::not four wheels"; fail=1; }
          pipx run twine check --strict *.whl || fail=1
          exit ${fail:-0}

      - name: SHA256SUMS
        working-directory: dist/release
        run: |
          sha256sum -- * | tee SHA256SUMS
          ls -la

      - name: Attach to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)" in
            true) echo "$TAG's draft exists; replacing its assets" ;;
            false) echo "::error::$TAG's release is published; a published release is not changed"; exit 1 ;;
            *)
              pre=""; case "$TAG" in *-*) pre=--prerelease ;; esac
              gh release create "$TAG" --draft $pre --verify-tag --title "$TAG" --generate-notes ;;
          esac
          gh release upload "$TAG" --clobber dist/release/*
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)\t\(.size) bytes"'
