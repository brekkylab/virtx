[package]
name = "virtx-uvm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# What a user runs, and what becomes a micro-VM: `session` (the default) answers a console,
# `image` manages the cache, and `boot` -- spawned by this binary itself -- enters a machine.
# See `boot.rs` for why the machine is a process of its own, and why it is this same file.
[[bin]]
name = "virtx-uvm"
path = "src/main.rs"

# virtio-gpu with venus, passed through to the machine. Its own feature because what it costs is
# a C library this tree neither ships nor builds. The Vulkan loader is not linked but opened,
# except on macOS where MoltenVK is built in -- which is what `libc` and `windows-sys` below
# are for.
[features]
gpu = ["virtx-uvm-lib/gpu", "dep:libc", "dep:windows-sys"]

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
# The image cache and the registry it pulls from.
virtx-uvm-lib = { workspace = true }
# A recipe, read from a Dockerfile.
virtx = { workspace = true }
# A built image is named by a SHA-256 of what was declared, and what it states is part of that.
sha2 = "0.10"
serde_json = "1"
# A snapshot travels gzipped.
flate2 = "1"
tokio = { workspace = true, features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }

# `dlopen`, to find the Vulkan loader a `gpu` boot opens rather than links.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

# `LoadLibraryW`, the same question on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }
