[package]
name = "virtx"
version = "0.2.1"
edition = "2024"
description = "microVM sandbox for AI agents: run commands in an isolated Linux VM from Rust, with no Docker or daemon to set up."
license = "Apache-2.0"
repository = "https://github.com/brekkylab/virtx"
readme = "../README.md"
homepage = "https://virtx.sh"
documentation = "https://docs.rs/virtx"
keywords = ["microvm", "sandbox", "ai-agents", "virtualization", "code-execution"]
categories = ["virtualization", "api-bindings", "asynchronous"]

[features]
# The client linked into this crate, so that `cargo add virtx` is all a Rust program needs. Off,
# `libvirtx_core` is opened at run time -- `load`, `$VIRTX_CORE_LIB`, or the system loader's
# search -- so that a process with other modules over it (the Python or Node package) shares one.
default = ["embedded"]
embedded = ["virtx-core/ffi"]

[dependencies]
# The types every request takes and answers; and, with `embedded`, the client behind the C ABI.
# The version is what a published `virtx` depends on, and is the one both crates say.
virtx-core = { path = "../virtx-core", version = "0.2.1", default-features = false }
# Opening `libvirtx_core` and finding its functions, without `embedded`.
libloading = "0.8"
# `Stream`, which a request answering item by item is.
futures-core = "0.3"
# What crosses the C ABI is JSON.
serde_json = "1"
serde = "1"
# What the library warns of, logged under the target `virtx`.
log = "0.4"

[dev-dependencies]
# A runtime to call in from, as a program with one does.
tokio = { version = "1", features = ["rt-multi-thread"] }
# The server's wire, spoken by hand where the client has no call for it, and a provider's.
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
