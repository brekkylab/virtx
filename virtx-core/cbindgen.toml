# `build.rs` writes `include/virtx.h` from `src/ffi.rs` with these settings.
language = "C"
cpp_compat = true
include_guard = "VIRTX_H"
documentation_style = "c99"
usize_is_size_t = true
autogen_warning = "/* Generated by cbindgen from src/ffi.rs: edit that, not this. */"
header = """
/*
 * Functions returning int return 0 or -1, and write the output as JSON, or the error, to their
 * last argument; free it with virtx_string_free.
 */"""

[parse]
parse_deps = false
