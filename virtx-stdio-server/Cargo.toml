[package]
name = "virtx-stdio-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The server, on `virtx-core`'s protocol over stdio: what a client spawns. Also, as
# `virtx-uvm vm`, the process that becomes a micro-VM, spawned by itself. The binary keeps
# the name `virtx-uvm`: it is what a release archive carries and what virtx fetches.
[[bin]]
name = "virtx-uvm"
path = "src/main.rs"

[features]
# A virtio-gpu device carrying Vulkan, for a sandbox that asks for one.
gpu = ["virtx-uvm/gpu"]

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["io-std", "macros", "rt-multi-thread"] }
# The stdio transport this binary serves the methods over.
virtx-core = { workspace = true, features = ["server"] }
# The methods, and the machines they start.
virtx-uvm = { workspace = true }

[dev-dependencies]
# The client end, to call the built binary as a client would.
virtx-core = { workspace = true, features = ["client", "server"] }
# An image's config, filed by hand, and a result read as any value.
serde_json = "1"
# A call's progress, read item by item.
futures-util = { version = "0.3", default-features = false }
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread"] }
