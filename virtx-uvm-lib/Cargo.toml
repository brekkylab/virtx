[package]
name = "virtx-uvm-lib"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Built-in virtio-gpu with venus (Vulkan). Requires virglrenderer with venus support --
# `cargo xtask build host` builds it first.
gpu = ["krun/gpu", "dep:krun_display"]

# Everything the binaries are made of: OCI images, the root filesystems made of them, and
# the sessions that boot them. The package carries the `-lib` suffix only because
# `virtx-uvm` is the binary a user runs; the library it provides is still `virtx_uvm`, which
# is what every consumer spells.
[lib]
name = "virtx_uvm"
path = "src/lib.rs"

[dependencies]
virtx = { workspace = true }

# The image spec's own types -- descriptors, digests, media types, references -- rather
# than copies of them. Not `runtime`: that half describes a container, which this is not.
oci-spec = { version = "0.10", default-features = false, features = ["image", "distribution"] }

# The registry side of the OCI distribution spec: token auth, manifest negotiation and
# blob downloads. Its TLS is chosen per platform, below.
oci-client = { version = "0.18", default-features = false }
# oci-client is async, and a layer's conversion is CPU that is moved off its threads. `net`
# and `macros` for the server's end of a session's console channel: a unix socket, or a pair
# of named pipes connected together.
tokio = { version = "1", features = ["rt", "net", "macros", "io-util", "sync", "time"] }
# A boot's failures, which are sentences about a process this one spawned and waited on
# rather than cases a caller matches -- see `boot`.
anyhow = { workspace = true }
# The index of what the cache holds.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The two compressions a registry serves archives under: gzip, which nearly every one
# does, and zstd. Both decoders pure Rust, so no C toolchain comes with them.
flate2 = "1"
ruzstd = "0.9"
sha2 = "0.10"
# Reading and writing the archives themselves.
tar = "0.4"
# A session's writable layer, read and written. Two crates because they are two jobs: the
# reader is what knows an inode's xattrs, device numbers and links; the formatter is the
# only way to make an ext4 image on a host with no `mke2fs`, and it is pure Rust. It is
# patched in the workspace root.
ext4 = "0.9"
arcbox-ext4 = "0.1"
# The trait the ext4 reader reads through.
positioned-io = "0.2"
thiserror = "2"
# The machine a session is: libkrun linked in, its block devices on, and the init it lays
# over the guest's root. Vendored, as `virtx-uvm-lib` takes them.
krun = { path = "../3rdparty/libkrun/src/libkrun", package = "libkrun", features = ["blk"] }
krun_init = { path = "../3rdparty/libkrun/init/init-blob", package = "krun-init-blob", features = ["direct"] }
# libkrun logs through `log`, and what the guest's console says arrives as a record of it.
log = "0.4"
# A display backend, which libkrun's virtio-gpu device has to be handed.
krun_display = { path = "../3rdparty/libkrun/src/display", package = "krun-display", optional = true }

# Whether a process is alive, for a sweep of sessions whose owner died -- `kill(pid, 0)`
# on unix, `OpenProcess` on Windows -- and the host's resolvers, which Windows keeps per
# adapter rather than in a file.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    # `GetAdaptersAddresses` and the adapter it walks are behind this one too: an adapter's
    # shape is NDIS's, and windows-sys gates the whole call on it.
    "Win32_NetworkManagement_Ndis",
    # `GlobalMemoryStatusEx`, for `machine::host_memory`.
    "Win32_System_SystemInformation",
    # `OpenProcess`, for `machine::doors::alive`.
    "Win32_System_Threading",
    # A job object, so a boot goes when the process that spawned it does -- see
    # `boot::reap_with_this_process`.
    "Win32_System_JobObjects",
    # Whether the Windows Hypervisor Platform is there -- see `boot::hypervisor`.
    "Win32_System_LibraryLoader",
] }

# oci-client's TLS, as `virtx-uvm-lib` chooses it and for the same reasons: the OS's own
# where there is one, and rustls on Linux, where a dynamic OpenSSL's soname is the
# distribution's.
[target.'cfg(not(target_os = "linux"))'.dependencies]
oci-client = { version = "0.18", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
