# Members share this workspace's target directory and lockfile. The Python and Node
# packages (`virtx-py`, `virtx-node`) are not Cargo crates: they load `libvirtx_core` at
# run time.
#
# The client is `virtx-core`, `virtx` (in `virtx-rs/`) and `virtx-cabi`, its C library. The server is the rest, kept apart because it is
# built apart: `virtx-uvm` is the whole of the machinery -- images, disks, machines -- and
# links libkrun. `virtx-server-stdio` is the server on `virtx-core`'s protocol over stdio --
# the `virtx-stdio` binary -- and, as `virtx-stdio boot`, spawned by itself, the process that
# becomes a microVM; `virtx-server-tcp` is the same server over Streamable HTTP, to the
# users and projects its config names. `xtask` builds, signs and packs them.
#
# A bare `cargo build` or `cargo test` builds and tests `virtx-core` alone: the server needs the
# submodules checked out and libkrun's patched (`cargo xtask init`), a guest kernel and a musl
# target, which a change to the client should not, and `virtx-rs`'s tests run against the
# servers, as `cargo xtask test -p virtx` serves them.
[workspace]
resolver = "3"
members = [
    "virtx-cabi",
    "virtx-cli",
    "virtx-core",
    "virtx-rs",
    "virtx-uvm",
    "virtx-server-stdio",
    "virtx-server-tcp",
    "xtask",
]
default-members = ["virtx-core"]

# `virtx-abins/` is a workspace root of its own: it is cross-compiled to
# `*-unknown-linux-musl`, and a member would be built for the host by a bare
# `cargo build` -- for a target that has no host to run on. Listed here and not merely
# left out of `members`: a package under this directory that is neither resolves against
# this root, and the ones in `virtx-abins/` inherit dependencies this workspace has no
# reason to declare.
#
# `virtx-uvm-guest/` is the agent inside each machine, which `virtx-uvm`'s build script
# cross-compiles to `*-unknown-linux-musl` and embeds -- a workspace root of its own for the
# same reason as `virtx-abins/`.
#
# `3rdparty/libkrun`, `3rdparty/rutabaga_gfx` and `3rdparty/smoltcp` are projects of their own,
# whose crates are taken by path: libkrun's by `virtx-uvm`, the others' by `[patch.crates-io]`
# below.
exclude = [
    "3rdparty/libkrun",
    "3rdparty/rutabaga_gfx",
    "3rdparty/smoltcp",
    "virtx-abins",
    "virtx-uvm-guest",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
# 1.89 for `std::fs::File::lock`, which guards `index.json` against concurrent pulls.
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
# The protocol the servers answer: the methods' args and outputs, and the server's end of
# the stdio and Streamable HTTP transports. No default features, which are the C ABI over a
# client; a member takes `server`.
virtx-core = { path = "virtx-core", default-features = false }
virtx-uvm = { path = "virtx-uvm" }
# HTTP/2 between client and server, over TCP or over a child's stdio, both ends of it. No
# default features, which are its client; a member takes `client` or `server`.
http-over-x = { git = "https://github.com/ailoy-co/http-over-x", rev = "266037f82382f1d90a1ae694e73df5ddf50880d8", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
tokio = "1"

# rutabaga_gfx 0.1.85 on crates.io predates the Darwin sys layer (merged
# 2026-09-02) and routes macOS to a stub backend that panics at runtime. Taken by path from
# the submodule `3rdparty/rutabaga_gfx` until a release carries it: upstream's commit with
# `3rdparty/_patches/rutabaga_gfx` applied in its tree by `cargo xtask init`. magma-gpu lives
# in the same repository. This reaches libkrun's `rutabaga_gfx = "0.1.85"` too.
[patch.crates-io]
rutabaga_gfx = { path = "3rdparty/rutabaga_gfx" }
magma-gpu = { path = "3rdparty/rutabaga_gfx/third_party/mesa3d/src/virtio/magma-gpu-rs/lib" }
# smoltcp's main, with `3rdparty/_patches/smoltcp` applied in its tree by `cargo xtask init`,
# until a release stops a paused SYN|ACK from waking the guest's network at once.
smoltcp = { path = "3rdparty/smoltcp" }
