# Build every package virtx is published as -- the Node and Python packages, each carrying
# `libvirtx_core` for every platform -- pack them as they would be published, install and run
# them the way a user would, and then publish them.
#
# The library is built once per platform, and every package of that platform carries the same
# build: an npm package per platform (`@brekkylab/virtx-<platform>`, an optional dependency of
# `@brekkylab/virtx`), and a wheel per platform. Neither has native code of its own: they open
# the library with koffi and ctypes.
#
# The test publishes nothing. The npm packages go to a registry on the test runner's own
# localhost, so `npm install @brekkylab/virtx` resolves its optional platform packages by
# os/cpu/libc exactly as it would from npmjs; and the wheels are installed with pip choosing one
# from a directory, as it would choose from PyPI. Each then opens the library it carries and
# calls into it -- everything short of a server, which is not part of these packages.
#
# The Rust crate, `virtx-rs`, is not published (`publish = false`), so it is not built here.
#
# # Publishing
#
# Only once every platform's test has passed, and only what those tests installed: the
# `publish-*` jobs take the very archives `assemble` uploaded, and build nothing. One job per
# registry, so one that fails leaves the other published and is re-run alone. Each skips what
# its registry already holds at this version, which is what makes a re-run safe -- a registry
# refuses a version twice, and neither takes one back.
#
# - npm: every platform package first, then `@brekkylab/virtx`, whose optional dependencies name them.
# - PyPI: every wheel.
#
# A release always publishes. A dispatch publishes unless told not to (`publish`), so a
# release can be tried here end to end first.
#
# It needs two secrets, the organization's: `NPM_TOKEN` (an npm automation or granular token
# that may publish `@brekkylab/virtx` and `@brekkylab/virtx-*`) and `PYPI_TOKEN` (an API token
# for `virtx`).
#
# # Platforms
#
# | package suffix  | wheel tag              | built on                            | tested on        |
# |-----------------|------------------------|-------------------------------------|------------------|
# | darwin-arm64    | macosx_11_0_arm64      | macos-15                            | macos-15         |
# | linux-x64-gnu   | manylinux_2_28_x86_64  | ubuntu-24.04, in manylinux_2_28     | ubuntu-22.04     |
# | linux-arm64-gnu | manylinux_2_28_aarch64 | ubuntu-24.04-arm, in manylinux_2_28 | ubuntu-22.04-arm |
# | win32-x64-msvc  | win_amd64              | windows-2025                        | windows-2025     |
#
# # The glibc floor
#
# The Linux library runs on glibc 2.28 and later: it is built in a manylinux_2_28 container
# (AlmaLinux 8), against its glibc's headers, and `The glibc the Linux library needs` fails a
# build that needs more. Built on the runner itself it would need the runner's glibc -- C
# compiled against its 2.39 headers needs 2.38's `__isoc23_*`. The Linux tests run on
# ubuntu-22.04, below the runner's glibc, where a library needing more fails to open.
#
# # When it runs
#
# For a release: when one is published, or when dispatched with the tag to release. The ref
# has to be a version tag, `vX.Y.Z`, and every manifest here -- both crates, npm's package, the
# wheel's -- has to say that version. A dispatch that does not publish may be of any ref, and
# is of the version its manifests say.
name: packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: The version tag to release (vX.Y.Z); without publish, any ref
        required: true
      publish:
        description: Publish to npm and PyPI once every test passes
        type: boolean
        default: true

# One run per tag, and never one cut short: a release that stopped halfway is one nobody can
# tell from a finished one without looking.
concurrency:
  group: packages-${{ github.event.release.tag_name || inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The tag this run releases: the release's own, or the one it was dispatched with.
  REF: ${{ github.event.release.tag_name || inputs.ref }}
  # Whether this run publishes: a release always does, a dispatch unless told not to.
  PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}

jobs:
  # What this release is.
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}

      - id: resolve
        name: Every manifest is the tag's version
        run: |
          fail() { echo "::error::$*"; exit 1; }
          toml() { sed -n 's/^version = "\(.*\)"$/\1/p' "$1" | head -1; }
          # A run that publishes nothing, of a ref that is not a version tag, is of whatever
          # version its manifests say.
          if ! [[ "$REF" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$ ]]; then
            [ "$PUBLISH" = false ] || fail "$REF is not a version tag: a release is tagged vX.Y.Z"
            version=$(node -p "require('./virtx-node/package.json').version")
            echo "$REF is not a version tag; building version $version, as virtx-node/package.json says"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=${BASH_REMATCH[1]}
          wrong=""
          for f in virtx-core/Cargo.toml virtx-rs/Cargo.toml virtx-py/pyproject.toml; do
            [ "$(toml "$f")" = "$version" ] || wrong="$wrong $f=$(toml "$f")"
          done
          json=$(node -p "require('./virtx-node/package.json').version")
          [ "$json" = "$version" ] || wrong="$wrong virtx-node/package.json=$json"
          [ -z "$wrong" ] || fail "$REF is version $version, but these manifests say otherwise:$wrong"
          echo "virtx $version ($REF)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # `libvirtx_core`, once per platform.
  build:
    name: build (${{ matrix.platform }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            file: libvirtx_core.dylib
          - platform: linux-x64-gnu
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64
            file: libvirtx_core.so
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64
            file: libvirtx_core.so
          - platform: win32-x64-msvc
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            file: virtx_core.dll
    runs-on: ${{ matrix.runner }}
    # The Linux library's glibc floor -- see above. None for macOS and Windows.
    container: ${{ matrix.container }}
    timeout-minutes: 60
    env:
      # The oldest macOS the wheel's tag says it runs on.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      # With the submodules: cargo loads the whole workspace, the servers' crates included,
      # and they name crates in libkrun and rutabaga_gfx. Unpatched is enough for the client.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
          submodules: true

      - id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Apart from anything built on the runner itself: C compiled against its newer
          # glibc's headers, restored here, would put that glibc back into the library.
          key: ${{ matrix.target }}${{ matrix.container && '-manylinux_2_28' || '' }}

      - name: libvirtx_core
        shell: bash
        run: |
          cargo xtask build client --locked --target ${{ matrix.target }}
          mkdir -p dist/lib
          cp target/${{ matrix.target }}/release/${{ matrix.file }} dist/lib/
          ls -la dist/lib

      # What the library needs from the loader to be opened at all: no DLL Windows does not
      # ship, so the C runtime is linked in (`.cargo/config.toml`).
      - name: The DLLs the Windows library loads
        if: runner.os == 'Windows'
        shell: bash
        run: |
          readobj="/c/Program Files/LLVM/bin/llvm-readobj.exe"
          f=dist/lib/${{ matrix.file }}
          "$readobj" --coff-imports "$f" | awk '/^Import \{/{k="load"} /^DelayImport \{/{k="delay"} /Name: .*\.dll/{print "  " k ": " $2}' | sort -u | tee imports.txt
          if grep -iE "load: (vcruntime|msvcp)" imports.txt; then
            echo "::error::$f needs the DLLs above to load"; exit 1
          fi

      # Above 2.28, or glibc 2.38's `__isoc23_*` -- which comes in unversioned, so the version
      # alone would not show it -- and the build stops here rather than on a user's machine.
      - name: The glibc the Linux library needs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          f=dist/lib/${{ matrix.file }}
          need=$(objdump -T "$f" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)
          echo "$f needs $need"
          if [ "$(printf '%s\n' "$need" GLIBC_2.28 | sort -V | tail -1)" != GLIBC_2.28 ]; then
            echo "::error::$f needs $need, above glibc 2.28"; fail=1
          fi
          if objdump -T "$f" | grep -q __isoc23_; then
            echo "::error::$f references __isoc23_*, glibc 2.38's"; fail=1
          fi
          exit "${fail:-0}"

      - uses: actions/upload-artifact@v7
        with:
          name: lib-${{ matrix.platform }}
          path: dist/lib/${{ matrix.file }}
          if-no-files-found: error

  # Every platform's library packed into every package: none of them compiles anything, so
  # all are packed here, on one runner.
  assemble:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Each into a directory of its platform's name, which the pack scripts read.
      - uses: actions/download-artifact@v8
        with:
          pattern: lib-*
          path: dist/lib

      - name: Every platform's library
        run: |
          for d in dist/lib/lib-*; do mv "$d" "dist/lib/${d#dist/lib/lib-}"; done
          ls -laR dist/lib

      - name: npm packages
        run: |
          node scripts/packages/pack-npm.mjs dist/lib dist/npm
          ls -la dist/npm
          tar -xzOf dist/npm/brekkylab-virtx-${{ needs.resolve.outputs.version }}.tgz package/package.json

      - name: wheels
        run: |
          python -m pip install --quiet build wheel
          scripts/packages/pack-wheels.sh dist/lib dist/wheels
          pipx run twine check --strict dist/wheels/*

      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: dist/npm/*.tgz
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: dist/wheels/*.whl
          if-no-files-found: error

  test:
    name: test (${{ matrix.platform }})
    needs: [resolve, assemble]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: linux-x64-gnu
            runner: ubuntu-22.04
          - platform: linux-arm64-gnu
            runner: ubuntu-22.04-arm
          - platform: win32-x64-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
          sparse-checkout: scripts/packages

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: dist/npm

      - uses: actions/download-artifact@v8
        with:
          name: wheels
          path: dist/wheels

      # A registry on localhost holding only what `assemble` packed. Published with an
      # explicit --registry and a config of its own: the packages' publishConfig names
      # npmjs, and nothing here may reach it.
      # Installed first and on its own: on Windows the install alone can outlast the wait for
      # the registry to answer.
      - name: Install from a local registry
        shell: bash
        run: |
          npm install --global --silent verdaccio@6
          cd scripts/packages
          verdaccio --config ./verdaccio.yaml --listen 4873 > "$RUNNER_TEMP/verdaccio.log" 2>&1 &
          for _ in $(seq 120); do curl -sf http://localhost:4873/-/ping >/dev/null && break; sleep 1; done
          curl -sf http://localhost:4873/-/ping >/dev/null || { echo "::error::the local registry did not start"; exit 1; }
          token=$(curl -sf -X PUT -H 'content-type: application/json' \
            -d '{"name":"ci","password":"ci-local-only"}' \
            http://localhost:4873/-/user/org.couchdb.user:ci | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          npmrc="$RUNNER_TEMP/npmrc"
          printf 'registry=http://localhost:4873/\n//localhost:4873/:_authToken=%s\n' "$token" > "$npmrc"
          for tgz in "$GITHUB_WORKSPACE"/dist/npm/*.tgz; do
            npm publish "$tgz" --userconfig "$npmrc" --registry http://localhost:4873/
          done
          mkdir -p "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project"
          echo '{"name":"project","private":true,"type":"module"}' > package.json
          npm install @brekkylab/virtx --userconfig "$npmrc" --registry http://localhost:4873/
          ls node_modules/@brekkylab

      - name: Install the wheel pip picks
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/bin/python"; [ -x "$py" ] || py="$RUNNER_TEMP/venv/Scripts/python.exe"
          "$py" -m pip install --no-index --find-links dist/wheels virtx
          "$py" -m pip show virtx
          echo "SMOKE_PYTHON=$py" >> "$GITHUB_ENV"

      - name: Smoke, Node
        shell: bash
        run: cd "$RUNNER_TEMP/project" && node "$GITHUB_WORKSPACE/scripts/packages/smoke/node.mjs"

      - name: Smoke, Python
        shell: bash
        run: '"$SMOKE_PYTHON" "$GITHUB_WORKSPACE/scripts/packages/smoke/python.py"'

      - name: registry log
        if: failure()
        shell: bash
        run: cat "$RUNNER_TEMP/verdaccio.log" || true

  # The npm packages the tests installed. Every platform package before `@brekkylab/virtx`, so
  # that by the time anyone can install it, each optional dependency it names is there to
  # resolve.
  publish-npm:
    needs: [resolve, test]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: dist/npm

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          root="dist/npm/brekkylab-virtx-$VERSION.tgz"
          [ -f "$root" ] || { echo "::error::$root is not among the packed packages"; exit 1; }
          publish() {
            name=$(tar -xzOf "$1" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).name')
            if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "$name@$VERSION is on npm already"
              return
            fi
            npm publish "$1" --access public
            echo "published $name@$VERSION"
          }
          for tgz in dist/npm/*.tgz; do
            [ "$tgz" = "$root" ] || publish "$tgz"
          done
          publish "$root"

  # The wheels the tests installed, one per platform.
  publish-pypi:
    needs: [resolve, test]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels
          path: dist/wheels

      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          for whl in dist/wheels/*.whl; do
            case "$(basename "$whl")" in
              "virtx-$VERSION-"*) ;;
              *) echo "::error::$whl is not a wheel of virtx $VERSION"; exit 1 ;;
            esac
          done
          pipx run twine upload --non-interactive --skip-existing dist/wheels/*.whl
