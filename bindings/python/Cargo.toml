[package]
name = "virtx-python"
version = "0.1.1"
edition = "2024"
publish = false

[lib]
# Imported as `virtx._virtx` and re-exported by `python/virtx/__init__.py`. Must match the
# `#[pymodule]` name, or the import finds a library with no init function.
#
# `rlib` for a binding that builds virtx into its own extension (e.g. ailoy). Two extension
# modules cannot pass each other a `ConsoleClient`, since each links its own virtx and runtime, so
# such a binding links this crate and registers its classes through `register` (src/lib.rs).
name = "_virtx"
crate-type = ["cdylib", "rlib"]

[dependencies]
# No default features, so this crate's `[features]` alone decide what a wheel carries.
virtx = { path = "../..", default-features = false }
# `abi3-py310`: one wheel per platform, not per interpreter. No `extension-module`, which is
# deprecated: maturin sets `PYO3_BUILD_EXTENSION_MODULE` for its own build instead, leaving
# libpython unlinked for the interpreter, while `cargo test` still links it.
pyo3 = { version = "0.29", features = ["abi3-py310"] }
# Console methods need a tokio runtime (a stdio client drives a process), so Python
# awaitables are bridged onto one.
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
anyhow = "1"
tokio = { version = "1", features = ["sync"] }

[build-dependencies]
# Which link arguments an extension module needs, per platform: see build.rs.
pyo3-build-config = "0.29"

[features]
default = ["mount", "ensure"]
mount = ["virtx/mount"]
ensure = ["virtx/ensure"]
s3 = ["virtx/s3"]
gdrive = ["virtx/gdrive"]
notion = ["virtx/notion"]
