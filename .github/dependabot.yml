# A newer release of an action under `.github` arrives as a pull request: weekly, those that
# have one together. `/` is `.github/workflows`; the glob beside it is the composite actions'
# directories.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [CI/CD]
    commit-message:
      prefix: ci
