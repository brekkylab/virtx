[package]
name = "virtx-core"
version = "0.1.2"
edition = "2024"
publish = false

[lib]
# `rlib` for Rust (this crate's tests, and any crate that depends on it); `cdylib` and
# `staticlib` for C, as `libvirtx_core.{so,dylib,dll}` and `libvirtx_core.a`, declared by
# `include/virtx.h`.
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
anyhow = "1"
# HTTP for the Streamable HTTP client. The same reqwest 0.13 and rustls the `virtx` crate uses.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# `protocol::http`'s server: the request and response it handles, and the bodies in them.
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
# `protocol::http`'s session ids.
uuid = { version = "1", features = ["v4"] }
# `Stream`, which a call's progress is, and the macro that writes one.
futures-util = { version = "0.3", default-features = false }
async-stream = "0.3"
# The schema's types: their wire form, and the JSON Schema a server advertises for them.
schemars = "1"
serde = { version = "1", features = ["derive"] }
# What crosses the C ABI: a call's params and its output, as JSON text.
serde_json = { version = "1", features = ["raw_value"] }
# A session brings its own runtime, since C calls in without one. `rt-multi-thread` so the
# session's tasks run between C calls, not only inside one.
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
# Writes `include/virtx.h` from `src/ffi.rs`.
cbindgen = { version = "0.29", default-features = false }

[dev-dependencies]
# What serves the Streamable HTTP tests' server.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# The stdio tests' server reads its own stdin and writes its own stdout.
tokio = { version = "1", features = ["io-std"] }
