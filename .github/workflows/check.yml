# What needs no build: that every manifest says one version, which a tag names; ruff over
# virtx-py; and `cargo xtask check`: the format, clippy of the client and the servers, and the
# tests that boot nothing. `ci` and `release` call it beside `build`, so it answers first.
name: check

on:
  workflow_call:
    outputs:
      version:
        description: The version every manifest says
        value: ${{ jobs.check.outputs.version }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # virtx-node, virtx-rs and virtx-py say virtx-core's version, and a tag is `v` and that
      # version.
      - id: version
        name: Every manifest is one version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          toml() { sed -n 's/^version = "\(.*\)"$/\1/p' "$1" | head -1; }
          version=$(toml virtx-core/Cargo.toml)
          [ -n "$version" ] || { echo "::error::virtx-core/Cargo.toml has no version"; exit 1; }
          node=$(jq -r .version virtx-node/package.json)
          wrong=""
          [ "$node" = "$version" ] || wrong="$wrong virtx-node/package.json=$node"
          for f in virtx-rs/Cargo.toml virtx-py/pyproject.toml; do
            [ "$(toml "$f")" = "$version" ] || wrong="$wrong $f=$(toml "$f")"
          done
          [ -z "$wrong" ] || { echo "::error::virtx-core/Cargo.toml says $version, but:$wrong"; exit 1; }
          if [ "$REF_TYPE" = tag ] && [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG, but the manifests say $version"; exit 1
          fi
          echo "virtx $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v6

      # virtx-py's lint and format, by its `[tool.ruff]`.
      - name: ruff
        working-directory: virtx-py
        run: |
          uvx ruff check
          uvx ruff format --check

      # The channel and components rust-toolchain.toml names, with the runner's rustup.
      - name: Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: check

      # The guest init's cross-linker: clippy of the servers builds `virtx-uvm`, whose build
      # script builds the guest agent for musl.
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm

      - name: Add the guest's musl target
        run: cargo xtask init

      - run: cargo xtask check
