[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
serde_json = "1"
# What `build alib` fetches is checked against the sum its `sources` gives.
sha2 = "0.10"
# `build alib` runs its builds in a virtx machine.
virtx = { path = "../virtx-rs" }
